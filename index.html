<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ed">
<title>Want</title>
<style>
:root{
  --bg:#f5f2ed;--card:#fff;--ink:#1c1c1e;--muted:#757575;--line:#e7e1d9;
  --soft:#efebe5;--accent:#1c1c1e;--green:#e9f2eb;--sheet:#faf8f4;
  --shadow:0 10px 30px rgba(32,28,24,.07)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:linear-gradient(180deg,#f8f5f1 0,#f1ece6 100%);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  min-height:100vh;-webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:680px;margin:0 auto;padding:10px 14px calc(92px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 14px}
.brand{font-size:21px;font-weight:850;letter-spacing:-.03em}
.brand small{display:block;margin-top:2px;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0}
.counter{font-size:11px;color:var(--muted);background:#ffffffaa;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
.page{display:none}
.page.active{display:block;animation:fade .18s ease both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

.hero{padding:12px 4px 14px}
.hero h1{font-size:31px;line-height:1.1;letter-spacing:-.045em;margin:0 0 8px}
.hero p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.toolbar{display:flex;gap:8px;margin:0 0 12px}
.toolbtn{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;
  font-size:12px;font-weight:750;box-shadow:0 2px 10px rgba(40,34,29,.03)
}
.toolbtn span{color:var(--muted);font-weight:600}

.section{margin:16px 0 8px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 7px}
.sectionhead h2{font-size:14px;margin:0;letter-spacing:-.01em}
.sectionhead small{font-size:10px;color:var(--muted)}

.list{
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;box-shadow:var(--shadow)
}
.row{
  position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) 44px;
  align-items:center;min-height:76px;padding:10px 8px 10px 12px;background:transparent;border:0;width:100%;text-align:left;
}
.row + .row::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.rowmain{min-width:0}
.ico{width:34px;height:34px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.title{font-size:14px;line-height:1.4;font-weight:760;white-space:normal}
.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:10px;color:var(--muted)}
.reason{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.heart{
  width:44px;height:44px;border:0;background:transparent;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#74706b
}
.heart:active{background:var(--soft);transform:scale(.96)}
.chev{color:#b1aca5;font-size:16px}
.refresh{display:block;margin:10px auto 0;border:0;background:transparent;padding:10px 12px;font-size:12px;color:var(--muted);font-weight:700}
.refreshhint{font-size:10px;color:var(--muted);text-align:center;min-height:16px;margin-top:1px}

.today .row{grid-template-columns:42px minmax(0,1fr) 28px}
.today .row .chev{justify-self:center}
.empty{padding:22px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}

.panel{background:#ffffffee;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:10px 0 14px}
.panel h1{font-size:26px;line-height:1.2;letter-spacing:-.04em;margin:0 0 8px}
.panel h2{font-size:16px;margin:0 0 8px}
.panel p{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 14px}
.quick{display:grid;grid-template-columns:1fr 48px;gap:8px}
.quick input{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;min-width:0}
.quick button{border:0;background:var(--accent);color:#fff;border-radius:14px;font-size:22px}
.segment{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:4px;border-radius:13px;margin-bottom:12px}
.segment button{border:0;background:transparent;border-radius:9px;padding:9px;font-size:12px;font-weight:750;color:var(--muted)}
.segment button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.05)}

.saveditem{padding:12px 13px}
.saveditem + .saveditem{border-top:1px solid var(--line)}
.savedtitle{font-size:13px;font-weight:760;line-height:1.45}
.savedmeta{font-size:10px;color:var(--muted);margin-top:3px}
.savedacts{display:flex;gap:6px;margin-top:9px}
.savedacts button{border:0;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:750}
.primarymini{background:var(--accent);color:#fff}
.greenmini{background:var(--green)}
.softmini{background:var(--soft);color:var(--muted)}

.insightcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
.insightcard .eyebrow{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.insightcard strong{display:block;font-size:17px;line-height:1.45;letter-spacing:-.02em}
.insightcard p{font-size:11px;color:var(--muted);line-height:1.55;margin:7px 0 0}
.conf{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin-left:5px;font-size:9px;color:var(--muted);font-weight:650}

.actionpage{padding-top:8px}
.actionbox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.actionbox .bigico{font-size:36px;margin-bottom:12px}
.actionbox h2{font-size:22px;line-height:1.35;margin:0 0 8px}
.actionbox p{font-size:12px;color:var(--muted);line-height:1.65;margin:0 0 18px}
.bigbtn{width:100%;border:0;border-radius:15px;padding:14px 15px;font-weight:800;margin-top:9px}
.bigbtn.dark{background:var(--accent);color:#fff}
.bigbtn.light{background:var(--soft)}

.feedbackgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feedbackgrid button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px;text-align:left;min-height:78px}
.feedbackgrid strong{display:block;font-size:13px;margin-bottom:3px}
.feedbackgrid span{font-size:10px;color:var(--muted)}

.nav{
  position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(calc(100% - 28px),652px);display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(255,255,255,.93);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:0 12px 30px rgba(32,28,24,.12);z-index:20
}
.nav button{border:0;background:transparent;border-radius:15px;padding:8px 4px;color:var(--muted);font-size:10px}
.nav button b{display:block;font-size:17px;margin-bottom:2px}
.nav button.active{background:var(--soft);color:var(--ink)}

.sheetback{position:fixed;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.18s;z-index:40}
.sheetback.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,680px);
  background:var(--sheet);border-radius:24px 24px 0 0;padding:10px 14px calc(20px + env(safe-area-inset-bottom));
  transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:41;box-shadow:0 -10px 30px rgba(0,0,0,.12)
}
.sheet.show{transform:translate(-50%,0)}
.handle{width:38px;height:5px;border-radius:999px;background:#d0cbc4;margin:0 auto 12px}
.sheet h3{font-size:18px;margin:0 0 12px}
.sheetoptions{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sheetoptions button{width:100%;border:0;background:#fff;padding:13px 14px;text-align:left;font-size:13px}
.sheetoptions button + button{border-top:1px solid var(--line)}
.sheetoptions button.active{font-weight:800}
.sheetoptions button.active::after{content:"✓";float:right}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-10px);opacity:0;background:#1c1c1e;color:#fff;border-radius:999px;padding:10px 13px;font-size:11px;font-weight:700;transition:.2s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:390px){
  .app{padding-left:12px;padding-right:12px}
  .hero h1{font-size:28px}
  .row{grid-template-columns:40px minmax(0,1fr) 42px;padding-left:10px}
  .reason{max-width:145px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="toast" id="toast"></div>
<div class="app">
  <header class="topbar">
    <div class="brand">Want<small>考えなくても、やりたいに出会う</small></div>
    <div class="counter" id="counter">手がかり 0</div>
  </header>

  <section class="page active" id="page-discover">
    <div id="discoverMain">
      <div class="hero">
        <h1 id="heroTitle">今なら、どれ？</h1>
        <p>気になった行をそのままタップ。今じゃなければ♡に残す。</p>
      </div>

      <div class="toolbar">
        <button class="toolbtn" id="timeBtn">⏱ <b id="timeLabel">30分</b> <span>⌄</span></button>
        <button class="toolbtn" id="filterBtn">✦ <b id="filterLabel">おまかせ</b> <span>⌄</span></button>
      </div>

      <div class="section today hidden" id="todaySection">
        <div class="sectionhead"><h2>今日やりたい</h2><small id="todayCount"></small></div>
        <div class="list" id="todayList"></div>
      </div>

      <div class="section">
        <div class="sectionhead"><h2>おすすめ</h2><small>4件</small></div>
        <div class="list" id="recommendList"></div>
        <button class="refresh" id="refreshBtn">↻ 別の候補を見る</button>
        <div class="refreshhint" id="refreshHint"></div>
      </div>
    </div>

    <div class="actionpage hidden" id="doingView">
      <div class="actionbox">
        <div class="bigico" id="doingIcon">✨</div>
        <h2 id="doingTitle">—</h2>
        <p>アプリはここで閉じてOK。終わったら戻って1タップだけ。</p>
        <button class="bigbtn dark" id="doneBtn">やってきた</button>
        <button class="bigbtn light" id="cancelBtn">今回はやめた</button>
      </div>
    </div>

    <div class="actionpage hidden" id="feedbackView">
      <div class="actionbox">
        <div class="bigico">⌁</div>
        <h2>またやりたい？</h2>
        <p>長い記録は不要。この反応だけを次の候補に使います。</p>
        <div class="feedbackgrid">
          <button data-score="3"><strong>✨ 予想以上</strong><span>新しい発見</span></button>
          <button data-score="2"><strong>🤩 またやりたい</strong><span>かなり良かった</span></button>
          <button data-score="1"><strong>🙂 まあまあ</strong><span>悪くない</span></button>
          <button data-score="0"><strong>😐 今回は違った</strong><span>今日は合わない</span></button>
        </div>
      </div>
    </div>
  </section>

  <section class="page" id="page-save">
    <div class="panel">
      <h1>やりたいを残す</h1>
      <p>思いついた瞬間に1行だけ。締切も優先順位もありません。</p>
      <div class="quick"><input id="quickInput" placeholder="例：あのゲームを再開したい"><button id="quickAdd">＋</button></div>
    </div>

    <div class="panel">
      <div class="segment">
        <button class="active" data-bucket="today">今日</button>
        <button data-bucket="later">あとで</button>
      </div>
      <div class="list" id="savedList"></div>
    </div>
  </section>

  <section class="page" id="page-learn">
    <div class="hero">
      <h1>最近わかってきたこと</h1>
      <p>保存したWantと、実際にやってよかったWantを分けて見ます。</p>
    </div>
    <div id="insightList"></div>

    <div class="section">
      <div class="sectionhead"><h2>またやりたいだったもの</h2></div>
      <div class="list" id="likedList"></div>
    </div>
  </section>

  <nav class="nav">
    <button class="active" data-page="discover"><b>◉</b>見つける</button>
    <button data-page="save"><b>♡</b>残す</button>
    <button data-page="learn"><b>⌁</b>わかる</button>
  </nav>
</div>

<div class="sheetback" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h3 id="sheetTitle">選ぶ</h3>
  <div class="sheetoptions" id="sheetOptions"></div>
</div>

s": 15, "period": "any"}, "learn_science": {"id": "legacy:learn_science", "title": "科学の疑問を1つAIに聞く", "emoji": "🔬", "category": "learn", "minutes": 15, "period": "any"}, "learn_history": {"id": "legacy:learn_history", "title": "歴史上の人物を1人だけ調べる", "emoji": "📜", "category": "learn", "minutes": 15, "period": "any"}, "want_food": {"id": "legacy:want_food", "title": "今食べたいものを3つ眺める", "emoji": "🍽", "category": "want", "minutes": 15, "period": "any"}, "want_trip": {"id": "legacy:want_trip", "title": "今行きたい場所を3つ保存する", "emoji": "✈️", "category": "want", "minutes": 20, "period": "any"}, "want_buy": {"id": "legacy:want_buy", "title": "今ちょっと欲しいものを3つ眺める", "emoji": "🛍", "category": "want", "minutes": 15, "period": "any"}, "want_rest": {"id": "legacy:want_rest", "title": "今ほしい休み方を3つ考える", "emoji": "🌿", "category": "want", "minutes": 10, "period": "any"}, "want_day": {"id": "legacy:want_day", "title": "丸一日自由なら何をするか3案出す", "emoji": "🌤", "category": "want", "minutes": 15, "period": "any"}, "want_music": {"id": "legacy:want_music", "title": "今聴きたい音の雰囲気を1つ選ぶ", "emoji": "🎼", "category": "want", "minutes": 10, "period": "any"}, "want_space": {"id": "legacy:want_space", "title": "今いたい場所を3つ思い浮かべる", "emoji": "🏡", "category": "want", "minutes": 10, "period": "any"}, "want_reward": {"id": "legacy:want_reward", "title": "今ほしいごほうびを3案考える", "emoji": "🎁", "category": "want", "minutes": 10, "period": "any"}};
const FILTERS=[{"id": "all", "label": "おまかせ", "emoji": "✦"}, {"id": "rest", "label": "休む", "emoji": "☕"}, {"id": "play", "label": "遊ぶ", "emoji": "🎮"}, {"id": "music", "label": "音楽", "emoji": "🎧"}, {"id": "create", "label": "作る", "emoji": "🛠"}, {"id": "out", "label": "外へ", "emoji": "🚶"}, {"id": "food", "label": "食", "emoji": "🍽"}, {"id": "social", "label": "誰かと", "emoji": "❤️"}, {"id": "explore", "label": "新しい", "emoji": "🌱"}, {"id": "learn", "label": "知る", "emoji": "🧠"}, {"id": "want", "label": "欲求", "emoji": "✨"}];
const CAT={rest:["休む","☕"],play:["遊ぶ","🎮"],music:["音楽","🎧"],create:["作る","🛠"],out:["外へ","🚶"],food:["食","🍽"],social:["誰かと","❤️"],explore:["新しい","🌱"],learn:["知る","🧠"],want:["欲求","✨"]};
const KEY="want_v06_state";

let state=null;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!state){
  try{
    const old=JSON.parse(localStorage.getItem("want_v05_state")||"null");
    if(old) state=old;
  }catch(e){}
}
if(!state) state={logs:[],seen:{},later:[],today:[],custom:[],batchReject:{},sessionRefresh:0};

let minutes=30, filter="all", current=[], activeLogId=null, bucket="today";

function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function save(){persist();renderAll()}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1400)}
function byId(x){return ACTIVITIES.find(a=>a.id===x)}
function dayKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function daysSince(ts){return ts?(Date.now()-ts)/86400000:9999}
function periodNow(){const h=new Date().getHours();if(h<10)return"morning";if(h<17)return"day";if(h<22)return"evening";return"night"}
function activityFromEntry(x){
  if(x.activityId)return byId(x.activityId)||LEGACY[x.activityId]||null;
  if(x.legacyActivityId)return LEGACY[x.legacyActivityId]||null;
  if(x.title)return{id:"custom:"+x.id,title:x.title,emoji:"♡",category:"want",minutes:x.minutes||null,period:"any"};
  return null;
}
function logActivity(l){
  if(l.customTitle)return{id:l.activityId,title:l.customTitle,emoji:"♡",category:"want",minutes:null};
  return byId(l.activityId)||LEGACY[l.activityId]||null;
}
function doneFor(aid){return state.logs.filter(l=>l.status==="done"&&l.activityId===aid)}
function avg(aid){const x=doneFor(aid).filter(l=>typeof l.score==="number");return x.length?x.reduce((s,l)=>s+l.score,0)/x.length:null}
function normTitle(s){return(s||"").trim().replace(/\s+/g," ")}
function savedTitles(){
  const set=new Set();
  [...state.later,...state.today].forEach(x=>{const a=activityFromEntry(x);if(a)set.add(normTitle(a.title))});
  state.custom.forEach(x=>set.add(normTitle(x.title)));
  return set;
}
function isSaved(a){return savedTitles().has(normTitle(a.title))}
function rejectedToday(aid){return(state.batchReject[dayKey()]||[]).includes(aid)}
function shownWithin(aid,d){return state.seen[aid]&&daysSince(state.seen[aid])<d}

function preferences(){
  const p={};
  const bump=(cat,v)=>p[cat]=(p[cat]||0)+v;
  state.logs.forEach(l=>{if(l.status!=="done")return;const a=logActivity(l);if(a)bump(a.category,(l.score||0)*1.25+.25)});
  [...state.later,...state.today].forEach(x=>{const a=activityFromEntry(x);if(a)bump(a.category,.9)});
  state.custom.forEach(()=>bump("want",.5));
  return p;
}

function rankedPool(restDays=30){
  const now=periodNow(),pref=preferences();
  let pool=ACTIVITIES.filter(a=>!isSaved(a)&&!rejectedToday(a.id));
  if(filter!=="all")pool=pool.filter(a=>a.category===filter);
  pool=pool.filter(a=>a.minutes<=Math.max(20,minutes*1.6));
  let fresh=pool.filter(a=>!shownWithin(a.id,restDays));
  if(fresh.length>=12)pool=fresh;

  return pool.map(a=>{
    let s=Math.random()*.6;
    const av=avg(a.id);
    if(pref[a.category])s+=Math.min(1.2,pref[a.category]*.085);
    if(av!==null)s+=av*.23;
    if(a.period===now)s+=.34;
    if(a.period==="any")s+=.08;
    s+=Math.max(0,.48-Math.abs(a.minutes-minutes)/90);
    if(!state.seen[a.id])s+=.55;
    return{a,s};
  }).sort((x,y)=>y.s-x.s);
}

function reason(a){
  const p=preferences(),av=avg(a.id),now=periodNow();
  if(!state.seen[a.id])return"まだ見ていない";
  if(av!==null&&av>=1.7)return"前に好反応";
  if(p[a.category]&&p[a.category]>=4)return"最近の反応に近い";
  if(a.period===now&&a.period!=="any")return"今の時間帯向き";
  return"少し違う方向";
}

function pickFour(){
  let ranked=rankedPool(30);
  if(ranked.length<8)ranked=rankedPool(14);
  if(ranked.length<8)ranked=rankedPool(7);
  if(ranked.length<4)ranked=rankedPool(0);

  const selected=[],used=new Set();
  for(const x of ranked){
    if(selected.length>=4)break;
    if(filter==="all"&&used.has(x.a.category))continue;
    selected.push(x.a);used.add(x.a.category);
  }
  for(const x of ranked){
    if(selected.length>=4)break;
    if(!selected.some(a=>a.id===x.a.id))selected.push(x.a);
  }
  current=selected.slice(0,4);
  current.forEach(a=>state.seen[a.id]=Date.now());
  persist();
  renderRecommendations();
  const p=periodNow();
  document.getElementById("heroTitle").textContent=p==="morning"?"今朝なら、どれ？":p==="night"?"今夜なら、どれ？":"今なら、どれ？";
}

function renderRecommendations(){
  const el=document.getElementById("recommendList");
  if(!current.length){el.innerHTML='<div class="empty">この条件では候補が少なめです。<br>時間か方向を広げてみてください。</div>';return}
  el.innerHTML=current.map(a=>{const c=CAT[a.category]||["その他","•"];return`
    <div class="row" data-start="${a.id}">
      <div class="ico">${a.emoji}</div>
      <div class="rowmain">
        <div class="title">${a.title}</div>
        <div class="sub"><span>約${a.minutes}分</span><span>・</span><span>${c[0]}</span><span>・</span><span class="reason">${reason(a)}</span></div>
      </div>
      <button class="heart" data-save="${a.id}" aria-label="あとでに残す">♡</button>
    </div>`}).join("");
  el.querySelectorAll("[data-start]").forEach(r=>r.onclick=e=>{if(e.target.closest("[data-save]"))return;startActivity(r.dataset.start)});
  el.querySelectorAll("[data-save]").forEach(b=>b.onclick=e=>{e.stopPropagation();saveLater(b.dataset.save)});
}

function nextBatch(){
  const key=dayKey();state.batchReject[key]=state.batchReject[key]||[];
  current.forEach(a=>{if(!state.batchReject[key].includes(a.id))state.batchReject[key].push(a.id)});
  state.sessionRefresh=(state.sessionRefresh||0)+1;
  const hint=document.getElementById("refreshHint");
  hint.textContent=state.sessionRefresh>=2?"合わない時だけ「おまかせ」から方向を絞れます。":"";
  save();pickFour();
}

function saveLater(aid){
  const a=byId(aid);if(!a)return;
  if(!isSaved(a))state.later.unshift({id:id(),activityId:aid,addedAt:Date.now()});
  save();toast("あとでに残しました");
  current=current.filter(x=>x.id!==aid);
  pickFour();
}

function startActivity(aid,customTitle=null,entry=null){
  const a=customTitle?{title:customTitle,emoji:"♡"}:byId(aid)||LEGACY[aid];
  if(!a)return;
  const log={id:id(),activityId:aid,customTitle,startedAt:Date.now(),status:"started"};
  state.logs.unshift(log);activeLogId=log.id;
  if(entry){
    state.today=state.today.filter(x=>x.id!==entry.id);
    state.custom=state.custom.filter(x=>x.id!==entry.id);
  }
  save();
  document.getElementById("doingTitle").textContent=a.title;
  document.getElementById("doingIcon").textContent=a.emoji||"✨";
  document.getElementById("discoverMain").classList.add("hidden");
  document.getElementById("doingView").classList.remove("hidden");
  document.getElementById("feedbackView").classList.add("hidden");
  switchPage("discover");
}

function finish(){document.getElementById("doingView").classList.add("hidden");document.getElementById("feedbackView").classList.remove("hidden")}
function cancel(){
  const l=state.logs.find(x=>x.id===activeLogId);if(l){l.status="cancelled";l.finishedAt=Date.now()}
  save();resetDiscover();toast("今回はやめた、もOK");
}
function feedback(score){
  const l=state.logs.find(x=>x.id===activeLogId);if(l){l.status="done";l.finishedAt=Date.now();l.score=score}
  save();resetDiscover();toast(score>=2?"またやりたいを1つ見つけました":"反応を覚えました");
}
function resetDiscover(){
  activeLogId=null;
  document.getElementById("discoverMain").classList.remove("hidden");
  document.getElementById("doingView").classList.add("hidden");
  document.getElementById("feedbackView").classList.add("hidden");
  pickFour();
}

function quickAdd(){
  const i=document.getElementById("quickInput"),t=i.value.trim();if(!t)return;
  state.custom.unshift({id:id(),title:t,bucket:"later",addedAt:Date.now()});
  i.value="";save();toast("あとでに残しました");
}
function moveToToday(kind,xid){
  if(kind==="activity"){
    const x=state.later.find(v=>v.id===xid);if(!x)return;
    state.later=state.later.filter(v=>v.id!==xid);state.today.unshift({...x,movedAt:Date.now()});
  }else{const x=state.custom.find(v=>v.id===xid);if(x)x.bucket="today"}
  save();
}
function moveBack(kind,xid){
  if(kind==="activity"){
    const x=state.today.find(v=>v.id===xid);if(!x)return;
    state.today=state.today.filter(v=>v.id!==xid);state.later.unshift({...x,addedAt:Date.now()});
  }else{const x=state.custom.find(v=>v.id===xid);if(x)x.bucket="later"}
  save();
}
function removeItem(kind,xid){
  if(kind==="activity"){state.later=state.later.filter(v=>v.id!==xid);state.today=state.today.filter(v=>v.id!==xid)}
  else state.custom=state.custom.filter(v=>v.id!==xid);
  save();
}
function startSaved(kind,xid){
  if(kind==="activity"){
    const x=state.today.find(v=>v.id===xid);if(!x)return;
    const a=activityFromEntry(x);if(a)startActivity(a.id,null,x);
  }else{
    const x=state.custom.find(v=>v.id===xid);if(x)startActivity("custom:"+x.id,x.title,x);
  }
}

function renderToday(){
  const sec=document.getElementById("todaySection"),el=document.getElementById("todayList");
  const items=[
    ...state.today.map(x=>{const a=activityFromEntry(x);return a?{kind:"activity",id:x.id,a}:null}).filter(Boolean),
    ...state.custom.filter(x=>x.bucket==="today").map(x=>({kind:"custom",id:x.id,a:activityFromEntry(x)}))
  ];
  if(!items.length){sec.classList.add("hidden");return}
  sec.classList.remove("hidden");
  document.getElementById("todayCount").textContent=`${items.length}件`;
  el.innerHTML=items.map(x=>`
    <div class="row" data-todaystart="${x.kind}|${x.id}">
      <div class="ico">${x.a.emoji}</div>
      <div class="rowmain"><div class="title">${x.a.title}</div><div class="sub"><span>${x.a.minutes?`約${x.a.minutes}分`:"今日やりたい"}</span></div></div>
      <div class="chev">›</div>
    </div>`).join("");
  el.querySelectorAll("[data-todaystart]").forEach(r=>r.onclick=()=>{const[k,xid]=r.dataset.todaystart.split("|");startSaved(k,xid)});
}

function renderSaved(){
  const el=document.getElementById("savedList");
  let items=bucket==="today"
    ?[
      ...state.today.map(x=>{const a=activityFromEntry(x);return a?{kind:"activity",id:x.id,a}:null}).filter(Boolean),
      ...state.custom.filter(x=>x.bucket==="today").map(x=>({kind:"custom",id:x.id,a:activityFromEntry(x)}))
    ]
    :[
      ...state.later.map(x=>{const a=activityFromEntry(x);return a?{kind:"activity",id:x.id,a}:null}).filter(Boolean),
      ...state.custom.filter(x=>x.bucket!=="today").map(x=>({kind:"custom",id:x.id,a:activityFromEntry(x)}))
    ];
  if(!items.length){el.innerHTML=`<div class="empty">${bucket==="today"?"今日はまだ空っぽです。<br>「あとで」から何個でも今日へ移せます。":"まだありません。<br>候補の♡か、上から1行だけ。"}</div>`;return}
  el.innerHTML=items.map(x=>`
    <div class="saveditem">
      <div class="savedtitle">${x.a.emoji} ${x.a.title}</div>
      <div class="savedmeta">${x.a.minutes?`約${x.a.minutes}分`:"自分で残したWant"}</div>
      <div class="savedacts">
        ${bucket==="today"
          ?`<button class="primarymini" data-startsaved="${x.kind}|${x.id}">今やる</button><button class="greenmini" data-back="${x.kind}|${x.id}">あとでへ</button>`
          :`<button class="greenmini" data-today="${x.kind}|${x.id}">今日へ</button>`}
        <button class="softmini" data-remove="${x.kind}|${x.id}">消す</button>
      </div>
    </div>`).join("");
  el.querySelectorAll("[data-today]").forEach(b=>b.onclick=()=>{const[k,xid]=b.dataset.today.split("|");moveToToday(k,xid)});
  el.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{const[k,xid]=b.dataset.back.split("|");moveBack(k,xid)});
  el.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const[k,xid]=b.dataset.remove.split("|");removeItem(k,xid)});
  el.querySelectorAll("[data-startsaved]").forEach(b=>b.onclick=()=>{const[k,xid]=b.dataset.startsaved.split("|");startSaved(k,xid)});
}

function renderInsights(){
  const done=state.logs.filter(l=>l.status==="done");
  const clue=done.length+state.later.length+state.today.length+state.custom.length;
  document.getElementById("counter").textContent=`手がかり ${clue}`;

  const cats={};
  const bump=(cat,key,val)=>{cats[cat]=cats[cat]||{saved:0,done:0,sum:0};cats[cat][key]+=val};
  [...state.later,...state.today].forEach(x=>{const a=activityFromEntry(x);if(a)bump(a.category,"saved",1)});
  state.custom.forEach(()=>bump("want","saved",1));
  done.forEach(l=>{const a=logActivity(l);if(a){bump(a.category,"done",1);bump(a.category,"sum",l.score||0)}});
  const rows=Object.entries(cats).map(([cat,v])=>({cat,...v,avg:v.done?v.sum/v.done:0}));

  const box=document.getElementById("insightList");
  let html="";
  const best=rows.filter(x=>x.done>=2).sort((a,b)=>b.avg-a.avg)[0];
  if(best){
    const c=CAT[best.cat]||["何か","✨"],conf=best.done>=5?"高め":best.done>=3?"中":"まだ弱い";
    html+=`<div class="insightcard"><div class="eyebrow">実際にやった後</div><strong>${c[1]} 「${c[0]}」の満足度が今は高め <span class="conf">${conf}</span></strong><p>${best.done}回の実行から見ています。回数が増えると更新します。</p></div>`;
  }
  const saved=rows.filter(x=>x.saved>=2).sort((a,b)=>b.saved-a.saved)[0];
  if(saved){
    const c=CAT[saved.cat]||["何か","✨"];
    html+=`<div class="insightcard"><div class="eyebrow">気になって残したもの</div><strong>♡ 「${c[0]}」に反応することが多め</strong><p>今日・あとでへの保存が ${saved.saved}件あります。実行後の満足度とは分けています。</p></div>`;
  }
  if(!html)html='<div class="insightcard"><div class="eyebrow">まだ途中</div><strong>数回使うと、保存と実行の違いが見えてきます。</strong><p>「気になる」と「やってよかった」は同じとは限りません。</p></div>';
  box.innerHTML=html;

  const liked=document.getElementById("likedList"),goods=done.filter(l=>l.score>=2).slice(0,8);
  liked.innerHTML=goods.length?goods.map(l=>{const a=logActivity(l);return a?`<div class="saveditem"><div class="savedtitle">${a.emoji} ${a.title}</div><div class="savedmeta">${l.score===3?"予想以上":"またやりたい"}</div></div>`:""}).join(""):'<div class="empty">まだありません。</div>';
}

function renderAll(){renderToday();renderSaved();renderInsights()}

function switchPage(p){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById("page-"+p).classList.add("active");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  window.scrollTo({top:0,behavior:"smooth"});
  renderAll();
}

function openSheet(type){
  const title=document.getElementById("sheetTitle"),opts=document.getElementById("sheetOptions");
  if(type==="time"){
    title.textContent="使える時間";
    const vals=[10,15,30,60,120];
    opts.innerHTML=vals.map(v=>`<button class="${v===minutes?"active":""}" data-sheet-time="${v}">${v===120?"2時間":v===60?"1時間":v+"分"}</button>`).join("");
    opts.querySelectorAll("[data-sheet-time]").forEach(b=>b.onclick=()=>{minutes=+b.dataset.sheetTime;document.getElementById("timeLabel").textContent=minutes===120?"2時間":minutes===60?"1時間":minutes+"分";closeSheet();state.sessionRefresh=0;pickFour()});
  }else{
    title.textContent="方向を絞る";
    opts.innerHTML=FILTERS.map(f=>`<button class="${f.id===filter?"active":""}" data-sheet-filter="${f.id}">${f.emoji} ${f.label}</button>`).join("");
    opts.querySelectorAll("[data-sheet-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.sheetFilter;const f=FILTERS.find(x=>x.id===filter);document.getElementById("filterLabel").textContent=f?.label||"おまかせ";closeSheet();state.sessionRefresh=0;pickFour()});
  }
  document.getElementById("sheetBack").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){document.getElementById("sheetBack").classList.remove("show");document.getElementById("sheet").classList.remove("show")}

document.getElementById("timeBtn").onclick=()=>openSheet("time");
document.getElementById("filterBtn").onclick=()=>openSheet("filter");
document.getElementById("sheetBack").onclick=closeSheet;
document.getElementById("refreshBtn").onclick=nextBatch;
document.getElementById("doneBtn").onclick=finish;
document.getElementById("cancelBtn").onclick=cancel;
document.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>feedback(+b.dataset.score));
document.getElementById("quickAdd").onclick=quickAdd;
document.getElementById("quickInput").addEventListener("keydown",e=>{if(e.key==="Enter")quickAdd()});
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
document.querySelectorAll("[data-bucket]").forEach(b=>b.onclick=()=>{bucket=b.dataset.bucket;document.querySelectorAll("[data-bucket]").forEach(x=>x.classList.toggle("active",x===b));renderSaved()});

document.getElementById("timeLabel").textContent="30分";
document.getElementById("filterLabel").textContent="おまかせ";
pickFour();renderAll();
</script>
</body>
</html>
