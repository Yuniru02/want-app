<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ed">
<title>これしよ</title>
<style>
:root{
  --bg:#f5f2ed;--card:#fff;--ink:#1c1c1e;--muted:#76716b;--line:#e7e1d9;
  --soft:#efebe5;--accent:#1c1c1e;--green:#e8f1e9;--warm:#f3ece3;--blue:#eaf0f3;
  --sheet:#faf8f4;--shadow:0 9px 28px rgba(32,28,24,.065)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:linear-gradient(180deg,#f8f5f1 0,#f1ece6 100%);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  min-height:100vh;-webkit-tap-highlight-color:transparent
}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{max-width:680px;margin:0 auto;padding:10px 14px calc(92px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 14px}
.brand{font-size:21px;font-weight:850;letter-spacing:-.03em}
.brand small{display:block;margin-top:2px;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0}
.version{margin-left:6px;font-size:9px;opacity:.55;font-weight:650}
.counter{font-size:11px;color:var(--muted);background:#ffffffaa;border:1px solid var(--line);padding:7px 10px;border-radius:999px}

.page{display:none}.page.active{display:block;animation:fade .18s ease both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

.hero{padding:12px 4px 12px}
.hero h1{font-size:31px;line-height:1.1;letter-spacing:-.045em;margin:0 0 8px}
.hero p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}

.section{margin:15px 0 8px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 7px}
.sectionhead h2{font-size:14px;margin:0;letter-spacing:-.01em}
.sectionhead small{font-size:10px;color:var(--muted)}

.list{background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) 44px;align-items:center;min-height:74px;padding:9px 8px 9px 12px;background:transparent;border:0;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.row:active{background:#faf8f5}
.rowmain{min-width:0}
.ico{width:34px;height:34px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.title{font-size:14px;line-height:1.4;font-weight:760}
.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:10px;color:var(--muted)}
.reason{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.heart{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;color:#74706b;transition:.12s}
.heart.saved{color:#b6535a}
.heart:active{background:var(--soft);transform:scale(.94)}
.chev{color:#b1aca5;font-size:16px;justify-self:center}

.activecard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow);margin-bottom:14px}
.activehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:850;margin-bottom:6px}
.activecontent{display:flex;gap:11px;align-items:center}
.activeemoji{width:42px;height:42px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px}
.activetitle{font-size:15px;font-weight:800;line-height:1.4}
.activemeta{font-size:10px;color:var(--muted);margin-top:3px}
.activeclose{width:34px;height:34px;border:0;background:transparent;color:var(--muted);border-radius:50%;font-size:17px}
.activeactions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.activeactions button{min-height:44px;border:0;border-radius:11px;padding:8px 4px;font-size:9px;font-weight:760;background:var(--soft)}
.activeactions button:first-child{background:var(--green)}
.activehint{font-size:9px;color:var(--muted);text-align:center;margin-top:7px}
.notready{display:flex;gap:7px;margin-top:11px}
.notready button{border:0;border-radius:11px;padding:9px 10px;font-size:10px;font-weight:750}
.notready .laterbtn{background:var(--green)}
.notready .clearbtn{background:var(--soft);color:var(--muted)}

.addwant{display:block;width:100%;min-height:46px;border:1px dashed #d8d1c8;background:#ffffff99;border-radius:14px;color:var(--muted);font-size:12px;font-weight:750;margin:11px 0 4px}

.savedrow{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;min-height:72px;padding:9px 10px 9px 12px}
.savedrow + .savedrow::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.savedacts{display:flex;gap:5px;align-items:center}
.savedacts button{border:0;border-radius:10px;padding:8px 9px;font-size:9.5px;font-weight:760}
.todaybtn{background:var(--green)}.softbtn{background:var(--soft);color:var(--muted)}.startbtn{background:var(--accent);color:#fff}

.morelink{display:block;width:100%;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:11px;padding:10px;text-align:center}

.conditionbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-size:12px;font-weight:760;box-shadow:var(--shadow)}

.refresh{display:block;width:100%;min-height:44px;margin:10px auto 0;border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px 12px;font-size:12px;color:var(--ink);font-weight:750}
.refreshhint{font-size:10px;color:var(--muted);text-align:center;min-height:16px;margin-top:1px}
.limitnotice{background:var(--warm);border:1px solid #e8ded2;border-radius:16px;padding:14px;margin-top:10px;text-align:center}
.limitnotice p{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 9px}
.limitnotice button{min-height:44px;border:0;border-radius:11px;background:#fff;padding:9px 13px;font-size:11px;font-weight:760}

.rediscover{background:var(--warm);border:1px solid #e8ded2;border-radius:17px;padding:12px 13px;margin:12px 0}
.rediscover .eyebrow{margin-bottom:4px}
.rediscover strong{display:block;font-size:13px;line-height:1.45}
.rediscover small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.rediscover button{margin-top:9px;border:0;border-radius:10px;background:#fff;padding:8px 10px;font-size:10px;font-weight:750}

.insightcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
.insightcard strong{display:block;font-size:17px;line-height:1.45;letter-spacing:-.02em}
.insightcard p{font-size:11px;color:var(--muted);line-height:1.55;margin:7px 0 0}
.nextlabel{font-size:10px;font-weight:800;color:var(--muted);margin:14px 0 6px}
.nextlist{border-top:1px solid var(--line)}
.nextitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;min-height:48px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;text-align:left}
.nextitem span{font-size:12px;font-weight:720;line-height:1.4}.nextitem small{font-size:9px;color:var(--muted)}
.insightmore{width:100%;min-height:44px;border:0;border-radius:11px;background:var(--soft);margin-top:10px;font-size:11px;font-weight:760}
.conf{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin-left:5px;font-size:9px;color:var(--muted);font-weight:650}
.pluscard{background:linear-gradient(145deg,#fff,#f3f0eb);border:1px solid var(--line);border-radius:18px;padding:15px;margin:16px 0;box-shadow:var(--shadow)}
.pluscard .plus{font-size:11px;font-weight:850;letter-spacing:.08em;margin-bottom:6px}
.pluscard strong{display:block;font-size:14px;line-height:1.45}
.pluscard p{font-size:10px;color:var(--muted);line-height:1.55;margin:6px 0 11px}
.pluscard button{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:9px 11px;font-size:10px;font-weight:760}
.metricnote{font-size:10px;color:var(--muted);line-height:1.6;margin-top:8px;padding:0 4px}
.empty{padding:22px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.hidden{display:none!important}

.nav{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),652px);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.93);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:0 12px 30px rgba(32,28,24,.12);z-index:20}
.nav button{border:0;background:transparent;border-radius:15px;padding:8px 4px;color:var(--muted);font-size:10px}
.nav button b{display:block;font-size:17px;margin-bottom:2px}
.nav button.active{background:var(--soft);color:var(--ink)}

.sheetback{position:fixed;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.18s;z-index:40}
.sheetback.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,680px);max-height:90vh;overflow-y:auto;background:var(--sheet);border-radius:24px 24px 0 0;padding:10px 14px calc(20px + env(safe-area-inset-bottom));transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:41;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet.show{transform:translate(-50%,0)}
.handle{width:38px;height:5px;border-radius:999px;background:#d0cbc4;margin:0 auto 12px}
.sheet h3{font-size:18px;margin:0 0 5px}
.sheet p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 12px;white-space:pre-line}
.sheetoptions{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sheetoptions button{width:100%;border:0;background:#fff;padding:13px 14px;text-align:left;font-size:13px}
.sheetoptions button + button{border-top:1px solid var(--line)}
.sheetoptions button.active{font-weight:800}
.sheetoptions button.active::after{content:"✓";float:right}
.sheetoptions.categorygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:transparent;border:0;border-radius:0;overflow:visible}
.sheetoptions.categorygrid button{min-height:48px;border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.sheetoptions.categorygrid button + button{border-top:1px solid var(--line)}
.conditionpanel{background:transparent;border:0;border-radius:0;overflow:visible}
.conditiongroup{margin-bottom:16px}.conditiongroup strong{display:block;font-size:12px;margin:0 0 8px}
.conditiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.conditiongrid.time{grid-template-columns:repeat(4,minmax(0,1fr))}
.conditiongrid button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 4px;text-align:center;font-size:11px;font-weight:700}
.conditiongrid button + button{border-top:1px solid var(--line)}
.conditiongrid button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheetapply{width:100%;min-height:48px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:12px;font-weight:780}
.sheetinput{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;background:transparent;border:0}
.sheetinput input{min-width:0;min-height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px 12px}
.sheetinput button{min-width:68px;min-height:48px;border:0;border-radius:13px;background:var(--accent);color:#fff;text-align:center;font-weight:760}
.savedpanel{max-height:62vh;overflow:auto;background:#fff}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-10px);opacity:0;background:#1c1c1e;color:#fff;border-radius:999px;padding:10px 13px;font-size:11px;font-weight:700;transition:.2s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:390px){
  .app{padding-left:12px;padding-right:12px}
  .hero h1{font-size:28px}
  .row{grid-template-columns:40px minmax(0,1fr) 42px;padding-left:10px}
  .reason{max-width:140px}
  .activeactions button{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
<header class="topbar">
  <div class="brand">これしよ<small>何しよう、を、これしよに。 <span class="version">v0.12</span></small></div>
  <div class="counter" id="counter">手がかり 0</div>
</header>

<section class="page active" id="page-home">
  <div class="hero">
    <h1>やりたいこと</h1>
    <p>すでに心が動いたものを、ここから取り出す。</p>
  </div>

  <div id="activeCard" class="activecard hidden"></div>

  <div class="section hidden" id="todaySection">
    <div class="sectionhead"><h2>今日やりたい</h2><small id="todayCount"></small></div>
    <div class="list" id="todayList"></div>
  </div>

  <div class="section">
    <div class="sectionhead"><h2>あとでやりたい</h2><small id="laterCount"></small></div>
    <div class="list" id="laterList"></div>
    <button class="morelink hidden" id="laterMore">すべて見る</button>
  </div>
  <button class="addwant" id="openQuickAdd">＋ やりたいことを追加</button>
  <div id="rediscoverBox" class="rediscover hidden">
    <div class="eyebrow">前に残したこと</div>
    <strong id="rediscoverTitle"></strong>
    <small id="rediscoverMeta"></small>
    <button id="rediscoverToday">今日やりたいへ</button>
  </div>
</section>

<section class="page" id="page-discover">
  <div class="hero">
    <h1 id="discoverTitle">何しよう？</h1>
  </div>
  <button class="conditionbtn" id="conditionBtn"><span id="conditionLabel">30分くらい・おまかせ</span><span>⌄</span></button>

  <div class="section">
    <div class="sectionhead"><h2>おすすめ</h2><small id="recommendCount"></small></div>
    <div class="list" id="recommendList"></div>
    <button class="refresh" id="refreshBtn">もう少し見る</button>
    <div class="refreshhint" id="refreshHint"></div>
    <div class="limitnotice hidden" id="limitNotice"><p>この条件の候補はここまで。<br>条件を少し変えてみますか？</p><button id="limitCondition">条件を変える</button></div>
  </div>
</section>

<section class="page" id="page-learn">
  <div class="hero">
    <h1>気づき</h1>
    <p>これまでの反応から、次に試せそうなことを見つけます。</p>
  </div>
  <div id="insightList"></div>

  <div class="section">
    <div class="sectionhead"><h2>またやりたいこと</h2></div>
    <div class="list" id="likedList"></div>
  </div>

  <div class="pluscard" id="plusCard">
    <div class="plus">これしよ＋ — 構想テスト</div>
    <strong>もっと深く、自分の傾向を知る。</strong>
    <p>週・月ごとの変化、実行しやすい条件、AIによる自分専用候補、同期などを将来の有料機能として検証します。</p>
    <button id="plusInterest">これなら有料でも少し気になる</button>
  </div>

  <div class="metricnote" id="metricNote"></div>
</section>

<nav class="nav">
  <button class="active" data-page="home"><b>♡</b>ホーム</button>
  <button data-page="discover"><b>◎</b>見つける</button>
  <button data-page="learn"><b>⌁</b>気づき</button>
</nav>
</div>

<div class="sheetback" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h3 id="sheetTitle">選ぶ</h3>
  <p id="sheetDesc"></p>
  <div class="sheetoptions" id="sheetOptions"></div>
</div>

<script>
/*
Want Product Principles
1. 考えさせない
2. すぐ価値を出す
3. 入力より行動を記録する
4. 同じものを何度も見せない
5. 最適化しすぎず未知も混ぜる
6. 義務化しない
7. アプリの外へ送り出す
8. Home = 自分 / Discover = 外 / Learn = 自己理解
9. Active Want は常に1つ

function inferActivityTraits(a){
  const title=a?.title||"",base=CATEGORY_TRAITS[a?.category]||CATEGORY_TRAITS.want,t={...base};
  if(/外へ|外に出|外で|外気|散歩|歩く|公園|駅前|駅周辺|神社|寺|ドライブ|車で|川や海.+行く|街を歩/.test(title))t.place="outside";
  if(/家|部屋|布団|ソファ|風呂|シャワー|窓際/.test(title))t.place="home";
  if(/一緒|二人|相手|人に|交換する|ずつ言う/.test(title))t.social="social";
  if(/一人|自分だけ|誰にも見せない/.test(title))t.social="solo";
  if(/見る|眺める|聴く|読む|休む|横になる|目を閉じ|ぼーっと|過ごす|味わう/.test(title))t.activity="passive";
  if(/作る|考える|描く|歩く|散歩|行く|試す|調べる|探す|選ぶ|決める|伸ばす|浴びる|撮る|遊ぶ|触る|やる/.test(title))t.activity="active";
  if(/作る|考える|描く|編集|コラージュ|文章|図にする|企画|撮る|プレイリスト/.test(title))t.orientation="create";
  else if(/知らない|行ったことのない|普段.+ない|探す|調べる|試す|違う道|気になる方向/.test(title))t.orientation="explore";
  else if(/見る|眺める|聴く|読む|食べる|飲む|味わう|休む/.test(title))t.orientation="consume";
  if(/休|静か|ゆっくり|ぼーっと|目を閉じ|眺め|何もしない|一息|味わう/.test(title))t.stimulation="calm";
  if(/知らない|行ったことのない|普段.+ない|新しい|初め|変な|違う|ランダム|試す/.test(title))t.novelty="novel";
  if(/昔|好きな|今やっている|いつも/.test(title)&&!/(知らない|普段.+ない|違う)/.test(title))t.novelty="familiar";
  if(/次の休日|今月|明日|予定|イベント|フェス/.test(title))t.setup="planned";
  else if(t.place==="outside"||a?.minutes>=30)t.setup="light";
  else t.setup="instant";
  if(/動画|Web|アプリ|iPhone|AI|ゲーム|漫画|アニメ|映画|ドラマ|YouTube|App Store|Wikipedia|検索|画像|写真.+編集|サイト/.test(title))t.screen="screen";
  if(/散歩|歩く|風呂|シャワー|紙|飲み物|お菓子|食べる|外気|ストレッチ|神社|寺|公園/.test(title))t.screen="offscreen";
  t.completion=/[0-9０-９一二三五十]|だけ|1つ|一本|一枚|決める|作る|選ぶ|調べる|探す|試す/.test(title)?"finishable":"open";
  return t;
}

function buildTraitLearning(s=state){
  const result={doneCount:0,interestSamples:0,traits:{}};
  TRAIT_AXES.forEach(axis=>result.traits[axis]={});
  const entry=(axis,value)=>result.traits[axis][value]||(result.traits[axis][value]={interest:{score:0,samples:0,weight:0},satisfaction:{score:0,samples:0,positive:0,again:0,negative:0,sum:0}});
  const addInterest=(a,weight)=>{
    const traits=traitsFor(a);if(!traits)return;
    result.interestSamples++;
    TRAIT_AXES.forEach(axis=>{const x=entry(axis,traits[axis]);x.interest.samples++;x.interest.weight+=weight});
  };
  const addSatisfaction=(a,score)=>{
    const traits=traitsFor(a);if(!traits)return;
    result.doneCount++;
    const value=score===2?1:score===1?0.7:-0.2;
    TRAIT_AXES.forEach(axis=>{const x=entry(axis,traits[axis]).satisfaction;x.samples++;x.sum+=value;if(score>=1)x.positive++;if(score===2)x.again++;if(score===0)x.negative++});
  };
  const saveEvents=(s.events||[]).filter(e=>e.name==="candidate_save"&&e.activityId);
  const savedEventIds=new Set(saveEvents.map(e=>e.activityId));
  saveEvents.forEach(e=>addInterest(learningActivity(e.activityId),1));
  [...(s.later||[]),...(s.today||[])].forEach(x=>{if(!savedEventIds.has(x.activityId))addInterest(activityFromEntry(x),1)});

    const a=learningActivity(l.activityId,l.customTitle);if(!a)return;

  });

}

function satisfactionTraits(learning,minSamples=2){

    if(value!=="either"&&x.satisfaction.samples>=minSamples)list.push({axis,value,...x.satisfaction,rank:x.satisfaction.score*Math.min(1,x.satisfaction.samples/4)+x.satisfaction.positive/x.satisfaction.samples*.25});
  }));
  return list.sort((a,b)=>b.rank-a.rank||b.samples-a.samples);
}
function interestTraits(learning,minSamples=2){
  const list=[];
  TRAIT_AXES.forEach(axis=>Object.entries(learning.traits[axis]).forEach(([value,x])=>{
    if(value!=="either"&&x.interest.samples>=minSamples)list.push({axis,value,...x.interest});
  }));
  return list.sort((a,b)=>b.score-a.score||b.samples-a.samples);
}
function traitFitScore(a,learning){
  const traits=traitsFor(a);if(!traits||learning.doneCount<3)return 0;
  let sum=0,weight=0;
  TRAIT_AXES.forEach(axis=>{
    const x=learning.traits[axis]?.[traits[axis]]?.satisfaction;if(!x||x.samples<2)return;
    const confidence=Math.min(1,x.samples/4);sum+=Math.max(0,(x.score+.2)/1.2)*confidence;weight+=confidence;
  });

}

  const fit=traitFitScore(a,learning),trials=activityTrialCount(a.id,s);

  if(fit>=.62)return"fit";

}

function traitLabel(axis,value){return TRAIT_COPY[axis]?.[value]||`${axis}:${value}`}
function traitDiscoverGroup(feature){
  if(feature.axis==="place"&&feature.value==="outside")return"out";
  if(feature.axis==="social"&&feature.value==="social")return"social";
  if(feature.axis==="orientation"&&feature.value==="create"||feature.axis==="activity"&&feature.value==="active")return"create";
  if(feature.axis==="orientation"&&feature.value==="explore"||feature.axis==="novelty"&&feature.value==="novel")return"new";
  if(feature.axis==="stimulation"&&feature.value==="calm"||feature.axis==="energy"&&feature.value==="low")return"rest";

function findTraitGap(learning){
  if(learning.doneCount<6||learning.interestSamples<6)return null;
  let best=null;
  TRAIT_AXES.forEach(axis=>{
    const values=learning.traits[axis],interest=Object.entries(values).filter(([v,x])=>v!=="either"&&x.interest.samples>=2).sort((a,b)=>b[1].interest.score-a[1].interest.score)[0];
    const satisfied=Object.entries(values).filter(([v,x])=>v!=="either"&&x.satisfaction.samples>=2).sort((a,b)=>b[1].satisfaction.score-a[1].satisfaction.score)[0];
    if(!interest||!satisfied||interest[0]===satisfied[0])return;
    const interestedSat=values[interest[0]].satisfaction,delta=satisfied[1].satisfaction.score-(interestedSat.samples>=2?interestedSat.score:0);
    if(delta<.28)return;
    const candidate={axis,interestValue:interest[0],interestSamples:interest[1].interest.samples,satisfactionValue:satisfied[0],satisfactionSamples:satisfied[1].satisfaction.samples,delta};
    if(!best||candidate.delta>best.delta)best=candidate;
  });
  return best;
}
function calculateLocalMetrics(s=state){
  const sessions=s.sessions||[],eligible=sessions.filter(x=>x.batches>=1),withinSix=eligible.filter(x=>x.firstValueAt&&x.batchesAtValue<=1).length,noReactionTwelve=eligible.filter(x=>x.batches>=2&&!x.firstValueAt).length;
  const done=(s.logs||[]).filter(l=>l.status==="done"&&Number.isFinite(l.score)),positive=done.filter(l=>l.score>=1).length,again=done.filter(l=>l.score===2).length;
  const byType={fit:{shown:0,reactions:0},adjacent:{shown:0,reactions:0},explore:{shown:0,reactions:0}},shown=new Set(),reacted=new Set();
  (s.events||[]).forEach(e=>{
    if(e.name==="batch_shown")(e.recommendations||[]).forEach(r=>{const key=`${e.sessionId}|${r.id}|${r.type}`;if(!shown.has(key)){shown.add(key);if(byType[r.type])byType[r.type].shown++}});
    if((e.name==="candidate_save"||e.name==="candidate_start")&&e.recommendationType){const key=`${e.sessionId}|${e.activityId}|${e.recommendationType}`;if(!reacted.has(key)){reacted.add(key);byType[e.recommendationType].reactions++}}
  });
  Object.values(byType).forEach(x=>x.rate=x.shown?x.reactions/x.shown:0);
  return{withinSixRate:eligible.length?withinSix/eligible.length:0,withinSixCount:withinSix,eligibleSessions:eligible.length,noReactionTwelve,feedbackCount:done.length,positiveRate:done.length?positive/done.length:0,againRate:done.length?again/done.length:0,byRecommendationType:byType};
}
function discoverFilter(id){return DISCOVER_FILTERS.find(x=>x.id===id)||DISCOVER_FILTERS[0]}
function discoverCategory(internalCategory){return DISCOVER_FILTERS.find(x=>x.categories.includes(internalCategory))||DISCOVER_FILTERS[0]}
function timeLabel(value){return value===120?"2時間〜":value===60?"1時間":`${value}分`}
function conditionKey(m=minutes,f=filter){return`${m}|${f}`}
function updateConditionLabel(){const t=minutes===120?"2時間〜":`${timeLabel(minutes)}くらい`;document.getElementById("conditionLabel").textContent=`${t}・${discoverFilter(filter).label}`}
function storeConditionCache(withScroll=false){
  const key=conditionKey(),old=conditionCache.get(key)||{scrollY:0};
  conditionCache.set(key,{items:[...current],types:Object.fromEntries(current.map(a=>[a.id,currentRecommendationTypes.get(a.id)||"explore"])),scrollY:withScroll?window.scrollY:old.scrollY||0});
}

  track("condition_select",{minutes,filter});restoreCondition(restoreScroll);

function rankedPool(allowSessionRepeat=false){
  const now=periodNow(),pref=preferences(),learning=buildTraitLearning(),strength=personalizationStrength(learning.doneCount);
  let pool=ACTIVITIES.filter(a=>!isSaved(a)&&!isActive(a)&&!current.some(x=>x.id===a.id)&&(allowSessionRepeat||!sessionSeen.has(a.id)));
  if(filter!=="all")pool=pool.filter(a=>discoverFilter(filter).categories.includes(a.category));
  const timed=pool.filter(a=>a.minutes<=Math.max(20,minutes*1.6));
  if(timed.length>=6||filter==="all")pool=timed;
  return pool.map(a=>{
    const fit=traitFitScore(a,learning),trials=activityTrialCount(a.id);
    let s=Math.random()*.6;
    if(pref[a.category])s+=Math.min(1,pref[a.category]*.045);
    s+=fit*strength*1.6;
    if(a.period===now)s+=.34;if(a.period==="any")s+=.08;
    s+=Math.max(0,.48-Math.abs(a.minutes-minutes)/90);
    return{a,s,fit,trials,type:recommendationTypeFor(a,learning)};
  }).sort((x,y)=>y.s-x.s);
}
function pickCandidates(count,append=false){
  count=Math.min(count,18-(append?current.length:0));
  if(count<=0){renderRecommendations();return}
  if(!append){current=[];currentRecommendationTypes.clear()}
  let ranked=rankedPool(false);
  if(ranked.length<count){
    const unseenIds=new Set(ranked.map(x=>x.a.id));
    ranked=[...ranked,...rankedPool(true).filter(x=>!unseenIds.has(x.a.id))];
  }
  const selected=[],usedIds=new Set(),usedGroups=new Set(),learning=buildTraitLearning();
  const take=(pool,n,type,preferNewGroup=true)=>{
    const add=x=>{if(!x||usedIds.has(x.a.id)||selected.length>=count)return false;selected.push({a:x.a,type});usedIds.add(x.a.id);usedGroups.add(discoverCategory(x.a.category).id);return true};
    if(preferNewGroup)for(const x of pool){if(n<=0)break;if(filter==="all"&&!usedGroups.has(discoverCategory(x.a.category).id)&&add(x))n--}
    for(const x of pool){if(n<=0)break;if(add(x))n--}
  };
  if(count===6&&learning.doneCount>=6){
    take(ranked,4,"fit");
    const adjacent=[...ranked].sort((a,b)=>Math.abs(a.fit-.45)-Math.abs(b.fit-.45)||b.s-a.s);
    take(adjacent,1,"adjacent");
    const explore=[...ranked].sort((a,b)=>a.trials-b.trials||a.fit-b.fit||b.s-a.s);
    take(explore,1,"explore");
  }else{
    for(const x of ranked){
      if(selected.length>=count)break;
      const group=discoverCategory(x.a.category).id;
      if(filter==="all"&&usedGroups.has(group))continue;
      selected.push({a:x.a,type:x.type});usedIds.add(x.a.id);usedGroups.add(group);
    }
  }
  for(const x of ranked){
    if(selected.length>=count)break;
    if(!usedIds.has(x.a.id)){selected.push({a:x.a,type:x.type});usedIds.add(x.a.id)}
  }
  const picked=selected.slice(0,count),added=picked.map(x=>x.a);
  picked.forEach(x=>{sessionSeen.add(x.a.id);currentRecommendationTypes.set(x.a.id,x.type)});
  current=append?[...current,...added]:added;
  session.batches++;track("batch_shown",{ids:added.map(a=>a.id),recommendations:picked.map(x=>({id:x.a.id,type:x.type})),filter,minutes,append});
  storeConditionCache();persist();renderRecommendations();
}

      insightHtml=insightCard(level,`${traitLabel(best.axis,best.value)}は、やった後に「よかった」と感じることが多いようです。`,`${best.samples}回中${best.positive}回が「よかった」以上。${caution}`,trendGroup,best,true,learning);
    }else{
      insightHtml=insightCard("小さな手がかり","まだ、満足しやすい方向ははっきりしていません。",`実行後の記録 ${learning.doneCount}件。もう少し違うことも試すと見えやすくなります。`,"all",null,true,learning);
    }
    const gap=findTraitGap(learning);
    if(gap){
      const gapGroup=traitDiscoverGroup({axis:gap.axis,value:gap.satisfactionValue});
      insightHtml+=insightCard("選びやすさとの違い",`${traitLabel(gap.axis,gap.interestValue)}はよく保存・選択しています。一方、今のところ満足につながりやすいのは${traitLabel(gap.axis,gap.satisfactionValue)}でした。選びやすいことと、やってよかったことは少し違うのかもしれません。`,`保存・選択 ${gap.interestSamples}件、満足側の実行後評価 ${gap.satisfactionSamples}件。まだ変わる可能性があります。`,gapGroup,null,false,learning);
    }
  }
  document.getElementById("insightList").innerHTML=insightHtml;
  document.querySelectorAll("[data-insight-start]").forEach(b=>b.onclick=()=>requestStart(b.dataset.insightStart));
  document.querySelectorAll("[data-insight-more]").forEach(b=>b.onclick=()=>openDiscoverFor(b.dataset.insightMore));

  const goods=done.filter(l=>l.score>=2).slice(0,8);
  document.getElementById("likedList").innerHTML=goods.length?goods.map(l=>{const a=logActivity(l);return a?`<div class="savedrow"><div class="ico">${a.emoji}</div><div class="rowmain"><div class="title">${displayTitle(a)}</div><div class="sub"><span>またやりたい</span></div></div><div class="chev">♡</div></div>`:""}).join(""):'<div class="empty">まだありません。</div>';

  const completed=state.sessions.filter(s=>s.firstValueAt);
  if(completed.length){
    const times=completed.map(s=>s.firstValueAt-s.startedAt).sort((a,b)=>a-b),median=times[Math.floor(times.length/2)];
    const batches=completed.map(s=>s.batchesAtValue||1),avgB=batches.reduce((a,b)=>a+b,0)/batches.length;
    document.getElementById("metricNote").textContent=`端末内の実験メモ：最初の「保存 / いまやる」まで中央値 約${Math.round(median/1000)}秒、平均 ${avgB.toFixed(1)}回。外部送信はしていません。`;
  }else document.getElementById("metricNote").textContent="改善用の操作データはこの端末内だけに保存しています。";
  document.getElementById("plusInterest").textContent=state.plusInterest?"✓ 気になる、と記録済み":"これなら有料でも少し気になる";
}
function insightCard(kind,text,evidence,groupId,feature=null,showSuggestions=true,learning=buildTraitLearning()){
  const suggestions=showSuggestions?insightSuggestions(feature,learning):[];
  const next=showSuggestions?`<div class="nextlabel">次に試すなら</div><div class="nextlist">${suggestions.map(a=>`<button class="nextitem" data-insight-start="${a.id}"><span>${a.emoji} ${displayTitle(a)}</span><small>約${a.minutes}分</small></button>`).join("")}</div><button class="insightmore" data-insight-more="${groupId}">この方向でもっと見つける</button>`:"";
  return`<div class="insightcard"><div class="eyebrow">${kind}</div><strong>${text}</strong><p>${evidence}</p>${next}</div>`;
}
function insightSuggestions(feature,learning=buildTraitLearning()){
  const low=new Set(state.logs.filter(l=>l.status==="done"&&l.score===0&&daysSince(l.finishedAt||l.startedAt)<90).map(l=>l.activityId));
  const eligible=a=>!isSaved(a)&&!isActive(a)&&!low.has(a.id);
  const strong=satisfactionTraits(learning,2).slice(0,4),now=periodNow(),interestCounts={};
  state.logs.forEach(l=>interestCounts[l.activityId]=(interestCounts[l.activityId]||0)+1);
  state.events.filter(e=>e.name==="candidate_save"&&e.activityId).forEach(e=>interestCounts[e.activityId]=(interestCounts[e.activityId]||0)+1);
  const pool=ACTIVITIES.filter(eligible).map(a=>{
    const traits=traitsFor(a),shared=strong.filter(x=>traits[x.axis]===x.value).length,fit=traitFitScore(a,learning),tried=interestCounts[a.id]||0;
    const featureBonus=feature&&traits[feature.axis]===feature.value?0.7:0;
    return{a,score:fit*1.3+shared*0.24+featureBonus+1/(1+tried)*0.55+(a.period===now?0.18:a.period==="any"?0.05:0)+Math.random()*0.08,tried};
  }).sort((a,b)=>b.score-a.score||a.tried-b.tried);
  const chosen=[],groups=new Set();
  for(const x of pool){const group=discoverCategory(x.a.category).id;if(groups.has(group))continue;chosen.push(x.a);groups.add(group);if(chosen.length>=3)break}
  for(const x of pool){if(chosen.length>=3)break;if(!chosen.some(a=>a.id===x.a.id))chosen.push(x.a)}
  return chosen.slice(0,3);
}
function openDiscoverFor(groupId){
  applyCondition(minutes,groupId,false);switchPage("discover",false);
}
function renderAll(){renderActive();renderToday();renderLater();renderRediscover();renderInsights();renderRecommendations()}

function switchPage(p,restoreDiscoverScroll=true){
  if(currentPage==="discover")storeConditionCache(true);
  currentPage=p;
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById("page-"+p).classList.add("active");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  renderAll();
  if(p==="discover"&&restoreDiscoverScroll){const cached=conditionCache.get(conditionKey());requestAnimationFrame(()=>window.scrollTo({top:cached?.scrollY||0,behavior:"auto"}))}
  else window.scrollTo({top:0,behavior:"smooth"});
}

function openSheet(type){
  const title=document.getElementById("sheetTitle"),desc=document.getElementById("sheetDesc"),opts=document.getElementById("sheetOptions");
  opts.className="sheetoptions";
  if(type==="condition"){
    draftMinutes=minutes;draftFilter=filter;title.textContent="条件を変える";desc.textContent="今の気分に近いものだけ選んでください。";
    opts.classList.add("conditionpanel");renderConditionSheet();
  }else if(type==="add"){
    title.textContent="やりたいことを追加";desc.textContent="今はできなくても、あとで思い出したいことを。";
    opts.classList.add("conditionpanel");opts.innerHTML='<div class="sheetinput"><input id="sheetQuickInput" placeholder="やりたいこと" maxlength="100"><button id="sheetQuickAdd">追加</button></div>';
    document.getElementById("sheetQuickAdd").onclick=quickAdd;
    document.getElementById("sheetQuickInput").addEventListener("keydown",e=>{if(e.key==="Enter")quickAdd()});
    requestAnimationFrame(()=>document.getElementById("sheetQuickInput")?.focus());
  }
  showSheet();
}
function renderConditionSheet(){
  const opts=document.getElementById("sheetOptions");
  opts.innerHTML=`<div class="conditiongroup"><strong>時間</strong><div class="conditiongrid time">${[10,30,60,120].map(v=>`<button class="${v===draftMinutes?"active":""}" data-draft-time="${v}">${timeLabel(v)}</button>`).join("")}</div></div><div class="conditiongroup"><strong>今はどんな感じ？</strong><div class="conditiongrid">${DISCOVER_FILTERS.map(f=>`<button class="${f.id===draftFilter?"active":""}" data-draft-filter="${f.id}">${f.label}</button>`).join("")}</div></div><button class="sheetapply" id="applyCondition">この条件で見る</button>`;
  opts.querySelectorAll("[data-draft-time]").forEach(b=>b.onclick=()=>{draftMinutes=+b.dataset.draftTime;renderConditionSheet()});
  opts.querySelectorAll("[data-draft-filter]").forEach(b=>b.onclick=()=>{draftFilter=b.dataset.draftFilter;renderConditionSheet()});
  document.getElementById("applyCondition").onclick=()=>{applyCondition(draftMinutes,draftFilter);closeSheet()};
}
function openLaterSheet(){
  const title=document.getElementById("sheetTitle"),desc=document.getElementById("sheetDesc"),opts=document.getElementById("sheetOptions"),items=buildSavedItems("later");
  title.textContent="あとでやりたい";desc.textContent=`${items.length}件あります。`;opts.className="sheetoptions savedpanel";
  if(items.length)renderLaterRows(opts,items,true);else opts.innerHTML='<div class="empty">まだありません。</div>';showSheet();
}
function showSheet(){document.getElementById("sheetBack").classList.add("show");document.getElementById("sheet").classList.add("show")}
function openReplaceSheet(newA){
  const title=document.getElementById("sheetTitle"),desc=document.getElementById("sheetDesc"),opts=document.getElementById("sheetOptions");
  opts.className="sheetoptions";
  title.textContent="今は1つだけ";
  desc.textContent=`今は「${displayTitle({id:state.active.activityId,title:state.active.title})}」を選んでいます。\n「${displayTitle(newA)}」に入れ替えますか？\n\n今のものは「あとでやりたい」に残ります。`;
  opts.innerHTML=`<button id="replaceNow">入れ替える</button><button id="replaceCancel">キャンセル</button>`;
  document.getElementById("replaceNow").onclick=replaceActive;
  document.getElementById("replaceCancel").onclick=()=>{replacement=null;closeSheet()};
  showSheet();
}
function closeSheet(){document.getElementById("sheetBack").classList.remove("show");document.getElementById("sheet").classList.remove("show");document.getElementById("sheetOptions").className="sheetoptions"}

document.getElementById("sheetBack").onclick=()=>{replacement=null;closeSheet()};
document.getElementById("refreshBtn").onclick=nextBatch;
document.getElementById("conditionBtn").onclick=()=>openSheet("condition");
document.getElementById("limitCondition").onclick=()=>openSheet("condition");
document.getElementById("openQuickAdd").onclick=()=>openSheet("add");
document.getElementById("laterMore").onclick=openLaterSheet;
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
document.getElementById("plusInterest").onclick=()=>{state.plusInterest=!state.plusInterest;track("plus_interest",{interested:state.plusInterest});save();toast(state.plusInterest?"これしよ＋への関心を端末内に記録しました":"記録を外しました")};

window.wantV012=Object.freeze({
  getActivityTraits:activityId=>ACTIVITY_TRAITS[activityId]||null,
  getTraitLearning:()=>buildTraitLearning(),
  getLocalMetrics:()=>calculateLocalMetrics()
});
updateConditionLabel();restoreCondition(false);renderAll();markActiveReady();
