<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ed">
<title>Want</title>
<style>
:root{
  --bg:#f5f2ed;--card:#fff;--ink:#1c1c1e;--muted:#76716b;--line:#e7e1d9;
  --soft:#efebe5;--accent:#1c1c1e;--green:#e8f1e9;--warm:#f3ece3;--blue:#eaf0f3;
  --sheet:#faf8f4;--shadow:0 9px 28px rgba(32,28,24,.065)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:linear-gradient(180deg,#f8f5f1 0,#f1ece6 100%);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  min-height:100vh;-webkit-tap-highlight-color:transparent
}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{max-width:680px;margin:0 auto;padding:10px 14px calc(92px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 14px}
.brand{font-size:21px;font-weight:850;letter-spacing:-.03em}
.brand small{display:block;margin-top:2px;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0}
.version{margin-left:6px;font-size:9px;opacity:.55;font-weight:650}
.counter{font-size:11px;color:var(--muted);background:#ffffffaa;border:1px solid var(--line);padding:7px 10px;border-radius:999px}

.page{display:none}.page.active{display:block;animation:fade .18s ease both}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

.hero{padding:12px 4px 12px}
.hero h1{font-size:31px;line-height:1.1;letter-spacing:-.045em;margin:0 0 8px}
.hero p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}

.section{margin:15px 0 8px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 7px}
.sectionhead h2{font-size:14px;margin:0;letter-spacing:-.01em}
.sectionhead small{font-size:10px;color:var(--muted)}

.list{background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) 44px;align-items:center;min-height:74px;padding:9px 8px 9px 12px;background:transparent;border:0;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.row:active{background:#faf8f5}
.rowmain{min-width:0}
.ico{width:34px;height:34px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.title{font-size:14px;line-height:1.4;font-weight:760}
.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:10px;color:var(--muted)}
.reason{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.heart{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;color:#74706b;transition:.12s}
.heart:active{background:var(--soft);transform:scale(.94)}
.chev{color:#b1aca5;font-size:16px;justify-self:center}

.activecard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow);margin-bottom:14px}
.activehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:850;margin-bottom:6px}
.activecontent{display:flex;gap:11px;align-items:center}
.activeemoji{width:42px;height:42px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px}
.activetitle{font-size:15px;font-weight:800;line-height:1.4}
.activemeta{font-size:10px;color:var(--muted);margin-top:3px}
.activeclose{width:34px;height:34px;border:0;background:transparent;color:var(--muted);border-radius:50%;font-size:17px}
.activeactions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.activeactions button{border:0;border-radius:11px;padding:9px 4px;font-size:9.5px;font-weight:760;background:var(--soft)}
.activeactions button:first-child{background:var(--green)}
.activehint{font-size:9px;color:var(--muted);text-align:center;margin-top:7px}
.notready{display:flex;gap:7px;margin-top:11px}
.notready button{border:0;border-radius:11px;padding:9px 10px;font-size:10px;font-weight:750}
.notready .laterbtn{background:var(--green)}
.notready .clearbtn{background:var(--soft);color:var(--muted)}

.quick{display:grid;grid-template-columns:1fr 48px;gap:8px;margin-bottom:12px}
.quick input{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;min-width:0}
.quick button{border:0;background:var(--accent);color:#fff;border-radius:14px;font-size:22px}

.savedrow{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;min-height:72px;padding:9px 10px 9px 12px}
.savedrow + .savedrow::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.savedacts{display:flex;gap:5px;align-items:center}
.savedacts button{border:0;border-radius:10px;padding:8px 9px;font-size:9.5px;font-weight:760}
.todaybtn{background:var(--green)}.softbtn{background:var(--soft);color:var(--muted)}.startbtn{background:var(--accent);color:#fff}

.morelink{display:block;width:100%;border:0;background:transparent;color:var(--muted);font-size:11px;padding:10px;text-align:center}

.controlrow{display:flex;align-items:center;gap:8px;margin:0 0 8px;overflow:auto;scrollbar-width:none}
.controlrow::-webkit-scrollbar{display:none}
.timebtn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:750}
.catbtn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-size:11px;font-weight:700}
.catbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.catmore{width:36px;height:36px;min-width:36px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:18px;line-height:1}

.refresh{display:block;margin:10px auto 0;border:0;background:transparent;padding:10px 12px;font-size:12px;color:var(--muted);font-weight:700}
.refreshhint{font-size:10px;color:var(--muted);text-align:center;min-height:16px;margin-top:1px}

.rediscover{background:var(--warm);border:1px solid #e8ded2;border-radius:17px;padding:12px 13px;margin:12px 0}
.rediscover .eyebrow{margin-bottom:4px}
.rediscover strong{display:block;font-size:13px;line-height:1.45}
.rediscover small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.rediscover button{margin-top:9px;border:0;border-radius:10px;background:#fff;padding:8px 10px;font-size:10px;font-weight:750}

.insightcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
.insightcard strong{display:block;font-size:17px;line-height:1.45;letter-spacing:-.02em}
.insightcard p{font-size:11px;color:var(--muted);line-height:1.55;margin:7px 0 0}
.conf{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin-left:5px;font-size:9px;color:var(--muted);font-weight:650}
.pluscard{background:linear-gradient(145deg,#fff,#f3f0eb);border:1px solid var(--line);border-radius:18px;padding:15px;margin:16px 0;box-shadow:var(--shadow)}
.pluscard .plus{font-size:11px;font-weight:850;letter-spacing:.08em;margin-bottom:6px}
.pluscard strong{display:block;font-size:14px;line-height:1.45}
.pluscard p{font-size:10px;color:var(--muted);line-height:1.55;margin:6px 0 11px}
.pluscard button{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:9px 11px;font-size:10px;font-weight:760}
.metricnote{font-size:10px;color:var(--muted);line-height:1.6;margin-top:8px;padding:0 4px}
.empty{padding:22px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.hidden{display:none!important}

.nav{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),652px);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.93);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:0 12px 30px rgba(32,28,24,.12);z-index:20}
.nav button{border:0;background:transparent;border-radius:15px;padding:8px 4px;color:var(--muted);font-size:10px}
.nav button b{display:block;font-size:17px;margin-bottom:2px}
.nav button.active{background:var(--soft);color:var(--ink)}

.sheetback{position:fixed;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.18s;z-index:40}
.sheetback.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,680px);background:var(--sheet);border-radius:24px 24px 0 0;padding:10px 14px calc(20px + env(safe-area-inset-bottom));transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:41;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet.show{transform:translate(-50%,0)}
.handle{width:38px;height:5px;border-radius:999px;background:#d0cbc4;margin:0 auto 12px}
.sheet h3{font-size:18px;margin:0 0 5px}
.sheet p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.sheetoptions{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sheetoptions button{width:100%;border:0;background:#fff;padding:13px 14px;text-align:left;font-size:13px}
.sheetoptions button + button{border-top:1px solid var(--line)}
.sheetoptions button.active{font-weight:800}
.sheetoptions button.active::after{content:"✓";float:right}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-10px);opacity:0;background:#1c1c1e;color:#fff;border-radius:999px;padding:10px 13px;font-size:11px;font-weight:700;transition:.2s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:390px){
  .app{padding-left:12px;padding-right:12px}
  .hero h1{font-size:28px}
  .row{grid-template-columns:40px minmax(0,1fr) 42px;padding-left:10px}
  .reason{max-width:140px}
  .activeactions button{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
<header class="topbar">
  <div class="brand">Want<small>自分のやりたいを、忘れない <span class="version">v0.8</span></small></div>
  <div class="counter" id="counter">手がかり 0</div>
</header>

<section class="page active" id="page-home">
  <div class="hero">
    <h1>自分のWant</h1>
    <p>すでに心が動いたものを、ここから取り出す。</p>
  </div>

  <div id="activeCard" class="activecard hidden"></div>

  <div class="quick">
    <input id="quickInput" placeholder="今はできないけど、やりたいこと">
    <button id="quickAdd">＋</button>
  </div>

  <div class="section hidden" id="todaySection">
    <div class="sectionhead"><h2>今日やりたい</h2><small id="todayCount"></small></div>
    <div class="list" id="todayList"></div>
  </div>

  <div id="rediscoverBox" class="rediscover hidden">
    <div class="eyebrow">From past you</div>
    <strong id="rediscoverTitle"></strong>
    <small id="rediscoverMeta"></small>
    <button id="rediscoverToday">今日へ</button>
  </div>

  <div class="section">
    <div class="sectionhead"><h2>あとで</h2><small id="laterCount"></small></div>
    <div class="list" id="laterList"></div>
  </div>
</section>

<section class="page" id="page-discover">
  <div class="hero">
    <h1 id="discoverTitle">何か見つけたい？</h1>
    <p>まだ分からないときだけ、ここで新しいWantを探す。</p>
  </div>

  <div class="controlrow">
    <button class="timebtn" id="timeBtn">⏱ <span id="timeLabel">30分</span>⌄</button>
    <button class="catbtn active" data-quickcat="all">✦ おまかせ</button>
    <span id="quickCats"></span>
    <button class="catmore" id="catMore">＋</button>
  </div>

  <div class="section">
    <div class="sectionhead"><h2>おすすめ</h2><small>4件</small></div>
    <div class="list" id="recommendList"></div>
    <button class="refresh" id="refreshBtn">↻ 別の候補を見る</button>
    <div class="refreshhint" id="refreshHint"></div>
  </div>
</section>

<section class="page" id="page-learn">
  <div class="hero">
    <h1>最近わかってきたこと</h1>
    <p>「気になる」「今やる」「実際によかった」を分けて見ます。</p>
  </div>
  <div id="insightList"></div>

  <div class="section">
    <div class="sectionhead"><h2>またやりたいだったもの</h2></div>
    <div class="list" id="likedList"></div>
  </div>

  <div class="pluscard" id="plusCard">
    <div class="plus">WANT PLUS — 構想テスト</div>
    <strong>もっと深く、自分のWantを知る。</strong>
    <p>週・月ごとの変化、実行しやすい条件、AIによる自分専用候補、同期などを将来の有料機能として検証します。</p>
    <button id="plusInterest">これなら有料でも少し気になる</button>
  </div>

  <div class="metricnote" id="metricNote"></div>
</section>

<nav class="nav">
  <button class="active" data-page="home"><b>♡</b>ホーム</button>
  <button data-page="discover"><b>◎</b>見つける</button>
  <button data-page="learn"><b>⌁</b>わかる</button>
</nav>
</div>

<div class="sheetback" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h3 id="sheetTitle">選ぶ</h3>
  <p id="sheetDesc"></p>
  <div class="sheetoptions" id="sheetOptions"></div>
</div>

<script>
/*
Want Product Principles
1. 考えさせない
2. すぐ価値を出す
3. 入力より行動を記録する
4. 同じものを何度も見せない
5. 最適化しすぎず未知も混ぜる
6. 義務化しない
7. アプリの外へ送り出す
8. Home = 自分 / Discover = 外 / Learn = 自己理解
9. Active Want は常に1つ

function makeId(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

function track(name,meta={}){

  state.events=state.events.slice(-700);persist();
}
function firstValue(type){

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1400)}
function byId(x){return ACTIVITIES.find(a=>a.id===x)}
function dayKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function daysSince(ts){return ts?(Date.now()-ts)/86400000:9999}
function periodNow(){const h=new Date().getHours();if(h<10)return"morning";if(h<17)return"day";if(h<22)return"evening";return"night"}
function activityFromEntry(x){
  if(x.activityId)return byId(x.activityId)||LEGACY[x.activityId]||null;
  if(x.legacyActivityId)return LEGACY[x.legacyActivityId]||null;
  if(x.title)return{id:"custom:"+x.id,title:x.title,emoji:"♡",category:"want",minutes:x.minutes||null,period:"any"};
  return null;
}
function logActivity(l){
  if(l.customTitle)return{id:l.activityId,title:l.customTitle,emoji:"♡",category:"want",minutes:null};
  return byId(l.activityId)||LEGACY[l.activityId]||null;
}
function normTitle(s){return(s||"").trim().replace(/\s+/g," ")}
function savedTitles(){
  const set=new Set();
  [...state.later,...state.today].forEach(x=>{const a=activityFromEntry(x);if(a)set.add(normTitle(a.title))});
  state.custom.forEach(x=>set.add(normTitle(x.title)));
  return set;
}
function isSaved(a){return savedTitles().has(normTitle(a.title))}
function doneFor(aid){return state.logs.filter(l=>l.status==="done"&&l.activityId===aid)}
function avg(aid){const x=doneFor(aid).filter(l=>typeof l.score==="number");return x.length?x.reduce((s,l)=>s+l.score,0)/x.length:null}
function rejectedToday(aid){return(state.batchReject[dayKey()]||[]).includes(aid)}
function shownWithin(aid,d){return state.seen[aid]&&daysSince(state.seen[aid])<d}

function preferences(){
  const p={};
  const bump=(cat,v)=>p[cat]=(p[cat]||0)+v;
  state.logs.forEach(l=>{
    const a=logActivity(l);if(!a)return;
    if(l.status==="done")bump(a.category,(l.score||0)*1.2+.3);
    if(["started","unanswered","not_done","replaced"].includes(l.status))bump(a.category,.4);
  });
  [...state.later,...state.today].forEach(x=>{const a=activityFromEntry(x);if(a)bump(a.category,.85)});
  Object.entries(state.categoryUse).forEach(([cat,n])=>bump(cat,Math.min(2,n*.12)));
  return p;
}
function topQuickCats(){
  const p=preferences(),fallback=["create","play","out"];
  const ranked=Object.entries(p).filter(([cat])=>CAT[cat]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const r=[];[...ranked,...fallback].forEach(c=>{if(c!=="all"&&!r.includes(c)&&r.length<3)r.push(c)});
  if(filter!=="all"&&!r.includes(filter))r[r.length-1]=filter;
  return r.slice(0,3);
}
function rankedPool(restDays=30){
  const now=periodNow(),pref=preferences();
  let pool=ACTIVITIES.filter(a=>!isSaved(a)&&!rejectedToday(a.id));
  if(filter!=="all")pool=pool.filter(a=>a.category===filter);
  pool=pool.filter(a=>a.minutes<=Math.max(20,minutes*1.6));
  let fresh=pool.filter(a=>!shownWithin(a.id,restDays));
  if(fresh.length>=12)pool=fresh;
  return pool.map(a=>{
    let s=Math.random()*.6;const av=avg(a.id);
    if(pref[a.category])s+=Math.min(1.2,pref[a.category]*.085);
    if(av!==null)s+=av*.23;
    if(a.period===now)s+=.34;if(a.period==="any")s+=.08;
    s+=Math.max(0,.48-Math.abs(a.minutes-minutes)/90);
    if(!state.seen[a.id])s+=.55;
    return{a,s};
  }).sort((x,y)=>y.s-x.s);
}
function reason(a){
  const p=preferences(),av=avg(a.id),now=periodNow();
  if(!state.seen[a.id])return"まだ見ていない";
  if(av!==null&&av>=1.7)return"前に好反応";
  if(p[a.category]&&p[a.category]>=4)return"最近の反応に近い";
  if(a.period===now&&a.period!=="any")return"今の時間帯向き";
  return"少し違う方向";
}
function pickFour(){
  let ranked=rankedPool(30);
  if(ranked.length<8)ranked=rankedPool(14);
  if(ranked.length<8)ranked=rankedPool(7);
  if(ranked.length<4)ranked=rankedPool(0);
  const selected=[],used=new Set();
  for(const x of ranked){
    if(selected.length>=4)break;
    if(filter==="all"&&used.has(x.a.category))continue;
    selected.push(x.a);used.add(x.a.category);
  }
  for(const x of ranked){
    if(selected.length>=4)break;
    if(!selected.some(a=>a.id===x.a.id))selected.push(x.a);
  }
  current=selected.slice(0,4);
  current.forEach(a=>state.seen[a.id]=Date.now());
  session.batches++;track("batch_shown",{ids:current.map(a=>a.id),filter,minutes});
  persist();renderRecommendations();
}

function renderQuickCats(){
  const wrap=document.getElementById("quickCats");wrap.style.display="contents";
  wrap.innerHTML=topQuickCats().map(c=>{const x=CAT[c];return`<button class="catbtn ${filter===c?"active":""}" data-quickcat="${c}">${x[1]} ${x[0]}</button>`}).join("");
  document.querySelectorAll("[data-quickcat]").forEach(b=>b.onclick=()=>selectCategory(b.dataset.quickcat));
}
function selectCategory(cat){
  filter=cat;if(cat!=="all")state.categoryUse[cat]=(state.categoryUse[cat]||0)+1;
  track("category_select",{category:cat});renderQuickCats();state.sessionRefresh=0;pickFour();
}
function renderRecommendations(){
  const el=document.getElementById("recommendList");
  if(!current.length){el.innerHTML='<div class="empty">この条件では候補が少なめです。<br>時間か方向を広げてみてください。</div>';return}
  el.innerHTML=current.map(a=>{const c=CAT[a.category]||["その他","•"];return`
    <div class="row" data-start="${a.id}">
      <div class="ico">${a.emoji}</div>
      <div class="rowmain"><div class="title">${a.title}</div><div class="sub"><span>約${a.minutes}分</span><span>・</span><span>${c[0]}</span><span>・</span><span class="reason">${reason(a)}</span></div></div>
      <button class="heart" data-save="${a.id}">♡</button>
    </div>`}).join("");
  el.querySelectorAll("[data-start]").forEach(r=>r.onclick=e=>{if(e.target.closest("[data-save]"))return;requestStart(r.dataset.start)});
  el.querySelectorAll("[data-save]").forEach(b=>b.onclick=e=>{e.stopPropagation();saveLater(b.dataset.save)});
}
function nextBatch(){
  const key=dayKey();state.batchReject[key]=state.batchReject[key]||[];
  current.forEach(a=>{if(!state.batchReject[key].includes(a.id))state.batchReject[key].push(a.id)});
  state.sessionRefresh=(state.sessionRefresh||0)+1;session.refreshes++;track("refresh",{count:session.refreshes});
  document.getElementById("refreshHint").textContent=state.sessionRefresh>=2?"方向を選ぶと、当たりを早くできます。":"";
  save();pickFour();
}

let replacement=null;
function requestStart(aid,customTitle=null,entry=null){
  const a=customTitle?{id:aid,title:customTitle,emoji:"♡",category:"want"}:byId(aid)||LEGACY[aid];
  if(!a)return;
  if(state.active){
    replacement={aid,customTitle,entry,a};
    openReplaceSheet(a);
    return;
  }
  commitStart(aid,customTitle,entry,a);
}
function commitStart(aid,customTitle,entry,a){
  const log={id:makeId(),activityId:aid,customTitle,startedAt:Date.now(),status:"started",category:a.category||"want"};
  state.logs.unshift(log);
  state.active={logId:log.id,activityId:aid,customTitle,title:a.title,emoji:a.emoji||"✨",startedAt:log.startedAt,promptReady:false};
  if(entry){
    state.today=state.today.filter(x=>x.id!==entry.id);
    state.custom=state.custom.filter(x=>x.id!==entry.id);
  }
  const key=dayKey();state.batchReject[key]=state.batchReject[key]||[];
  if(!state.batchReject[key].includes(aid))state.batchReject[key].push(aid);
  firstValue("start");track("candidate_start",{activityId:aid,category:a.category||"want"});
  save();toast("ホームの「今はこれ」に置きました");
  switchPage("home");
}
function replaceActive(mode){
  if(!replacement)return;
  const old=state.active;
  const oldLog=state.logs.find(l=>l.id===old.logId);
  if(oldLog&&oldLog.status==="started")oldLog.status="replaced";
  if(mode==="save_old"){
    const oldA=byId(old.activityId)||LEGACY[old.activityId];
    if(oldA&&!isSaved(oldA))state.later.unshift({id:makeId(),activityId:old.activityId,addedAt:Date.now()});
    else if(old.customTitle)state.custom.unshift({id:makeId(),title:old.customTitle,bucket:"later",addedAt:Date.now()});
  }
  const r=replacement;state.active=null;replacement=null;closeSheet();
  commitStart(r.aid,r.customTitle,r.entry,r.a);
}
function saveActiveForLater(){
  if(!state.active)return;
  const x=state.active,log=state.logs.find(l=>l.id===x.logId);
  if(log&&log.status==="started")log.status="unanswered";
  const a=byId(x.activityId)||LEGACY[x.activityId];
  if(a&&!isSaved(a))state.later.unshift({id:makeId(),activityId:x.activityId,addedAt:Date.now()});
  else if(x.customTitle)state.custom.unshift({id:makeId(),title:x.customTitle,bucket:"later",addedAt:Date.now()});
  state.active=null;track("active_to_later",{});save();toast("あとでに戻しました");
}
function clearActive(){
  if(!state.active)return;
  const log=state.logs.find(l=>l.id===state.active.logId);
  if(log&&log.status==="started"){log.status="not_done";log.finishedAt=Date.now()}
  track("active_not_done",{});state.active=null;save();toast("やらなかった、も手がかりです");
}
function resolveActive(value){
  if(!state.active)return;
  const l=state.logs.find(x=>x.id===state.active.logId);
  if(l){
    l.finishedAt=Date.now();
    if(value==="not_done"){l.status="not_done";l.result="not_done"}
    else{l.status="done";l.score=+value}
  }
  track("active_feedback",{value});
  state.active=null;save();toast(value==="2"?"またやりたいを覚えました":value==="not_done"?"やらなかった、も手がかりです":"反応を覚えました");
}

  if(!state.active)return;

    state.active.promptReady=true;persist();renderActive();
  }

function saveLater(aid){
  const a=byId(aid);if(!a)return;
  if(!isSaved(a))state.later.unshift({id:makeId(),activityId:aid,addedAt:Date.now()});

function moveToToday(kind,xid){
  if(kind==="activity"){
    const x=state.later.find(v=>v.id===xid);if(!x)return;
    state.later=state.later.filter(v=>v.id!==xid);state.today.unshift({...x,movedAt:Date.now()});
  }else{const x=state.custom.find(v=>v.id===xid);if(x)x.bucket="today"}
  track("move_today",{kind});save();
}
function moveBack(kind,xid){
  if(kind==="activity"){
    const x=state.today.find(v=>v.id===xid);if(!x)return;
    state.today=state.today.filter(v=>v.id!==xid);state.later.unshift({...x,addedAt:Date.now()});
  }else{const x=state.custom.find(v=>v.id===xid);if(x)x.bucket="later"}
  save();

  if(kind==="activity"){state.later=state.later.filter(v=>v.id!==xid);state.today=state.today.filter(v=>v.id!==xid)}
  else state.custom=state.custom.filter(v=>v.id!==xid);
  save();
}
function startSaved(kind,xid,where){
  const source=where==="today"?state.today:state.later;
  if(kind==="activity"){
    const x=source.find(v=>v.id===xid);if(!x)return;
    const a=activityFromEntry(x);if(a)requestStart(a.id,null,where==="today"?x:null);
  }else{
    const x=state.custom.find(v=>v.id===xid);if(x)requestStart("custom:"+x.id,x.title,where==="today"?x:null);
  }
}

function renderActive(){
  const box=document.getElementById("activeCard");
  if(!state.active){box.classList.add("hidden");box.innerHTML="";return}
  const a=state.active;box.classList.remove("hidden");
  if(a.promptReady){
    box.innerHTML=`
      <div class="activehead">
        <div><div class="eyebrow">How was it?</div><div class="activecontent"><div class="activeemoji">${a.emoji}</div><div><div class="activetitle">${a.title}</div><div class="activemeta">選んだWant、どうだった？</div></div></div></div>
        <button class="activeclose" id="activeDismiss">×</button>
      </div>
      <div class="activeactions">
        <button data-active-score="2">♡ また</button><button data-active-score="1">○ まあまあ</button><button data-active-score="0">× 違った</button><button data-active-score="not_done">やらなかった</button>
      </div>
      <div class="activehint">答えなくてもOK。×なら今後は聞きません。</div>`;
    box.querySelectorAll("[data-active-score]").forEach(b=>b.onclick=()=>resolveActive(b.dataset.activeScore));
    document.getElementById("activeDismiss").onclick=dismissActiveFeedback;
  }else{
    box.innerHTML=`
      <div class="activehead">
        <div><div class="eyebrow">Now</div><div class="activecontent"><div class="activeemoji">${a.emoji}</div><div><div class="activetitle">${a.title}</div><div class="activemeta">今はこれを選んでいます</div></div></div></div>
      </div>
      <div class="notready"><button class="laterbtn" id="activeLater">あとでに戻す</button><button class="clearbtn" id="activeClear">やらなかった</button></div>`;
    document.getElementById("activeLater").onclick=saveActiveForLater;
    document.getElementById("activeClear").onclick=clearActive;
  }
}

function buildSavedItems(which){
  if(which==="today")return[
    ...state.today.map(x=>{const a=activityFromEntry(x);return a?{kind:"activity",id:x.id,a}:null}).filter(Boolean),
    ...state.custom.filter(x=>x.bucket==="today").map(x=>({kind:"custom",id:x.id,a:activityFromEntry(x)}))
  ];
  return[
    ...state.later.map(x=>{const a=activityFromEntry(x);return a?{kind:"activity",id:x.id,a}:null}).filter(Boolean),
    ...state.custom.filter(x=>x.bucket!=="today").map(x=>({kind:"custom",id:x.id,a:activityFromEntry(x)}))
  ];
}
function renderToday(){
  const sec=document.getElementById("todaySection"),el=document.getElementById("todayList"),items=buildSavedItems("today");
  if(!items.length){sec.classList.add("hidden");return}
  sec.classList.remove("hidden");document.getElementById("todayCount").textContent=`${items.length}件`;
  el.innerHTML=items.map(x=>`<div class="savedrow"><div class="ico">${x.a.emoji}</div><div class="rowmain"><div class="title">${x.a.title}</div><div class="sub"><span>${x.a.minutes?`約${x.a.minutes}分`:"今日やりたい"}</span></div></div><div class="savedacts"><button class="startbtn" data-starttoday="${x.kind}|${x.id}">今やる</button><button class="softbtn" data-back="${x.kind}|${x.id}">戻す</button></div></div>`).join("");
  el.querySelectorAll("[data-starttoday]").forEach(b=>b.onclick=()=>{const[k,xid]=b.dataset.starttoday.split("|");startSaved(k,xid,"today")});
  el.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{const[k,xid]=b.dataset.back.split("|");moveBack(k,xid)});
}
function renderLater(){
  const el=document.getElementById("laterList"),items=buildSavedItems("later");
  document.getElementById("laterCount").textContent=`${items.length}件`;
  if(!items.length){el.innerHTML='<div class="empty">まだありません。<br>「見つける」で♡を押すか、上から1行だけ。</div>';return}
  el.innerHTML=items.map(x=>`<div class="savedrow"><div class="ico">${x.a.emoji}</div><div class="rowmain"><div class="title">${x.a.title}</div><div class="sub"><span>${x.a.minutes?`約${x.a.minutes}分`:"自分で残したWant"}</span></div></div><div class="savedacts"><button class="todaybtn" data-today="${x.kind}|${x.id}">今日へ</button><button class="softbtn" data-remove="${x.kind}|${x.id}">消す</button></div></div>`).join("");
  el.querySelectorAll("[data-today]").forEach(b=>b.onclick=()=>{const[k,xid]=b.dataset.today.split("|");moveToToday(k,xid)});
  el.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const[k,xid]=b.dataset.remove.split("|");removeItem(k,xid)});
}
function oldWant(){
  return buildSavedItems("later").map(x=>{
    const src=x.kind==="activity"?state.later.find(v=>v.id===x.id):state.custom.find(v=>v.id===x.id);
    return{...x,age:daysSince(src?.addedAt||Date.now()),entry:src};
  }).filter(x=>x.age>=14).sort((a,b)=>b.age-a.age)[0]||null;
}
function renderRediscover(){
  const box=document.getElementById("rediscoverBox"),x=oldWant();
  if(!x){box.classList.add("hidden");return}
  box.classList.remove("hidden");document.getElementById("rediscoverTitle").textContent=`${x.a.emoji} ${x.a.title}`;
  document.getElementById("rediscoverMeta").textContent=`${Math.floor(x.age)}日前に「あとで」に残しました`;
  document.getElementById("rediscoverToday").onclick=()=>{moveToToday(x.kind,x.id);track("rediscover_today",{age:Math.floor(x.age)});toast("今日へ移しました")};
}

function renderInsights(){
  const done=state.logs.filter(l=>l.status==="done"),intent=state.logs.filter(l=>["started","unanswered","not_done","done","replaced"].includes(l.status));
  const clue=done.length+state.later.length+state.today.length+state.custom.length;
  document.getElementById("counter").textContent=`手がかり ${clue}`;
  const cats={};
  const bump=(cat,key,val)=>{cats[cat]=cats[cat]||{saved:0,intent:0,notDone:0,done:0,sum:0};cats[cat][key]+=val};
  [...state.later,...state.today].forEach(x=>{const a=activityFromEntry(x);if(a)bump(a.category,"saved",1)});
  state.custom.forEach(()=>bump("want","saved",1));
  intent.forEach(l=>{const a=logActivity(l);if(a){bump(a.category,"intent",1);if(l.status==="not_done")bump(a.category,"notDone",1);if(l.status==="done"){bump(a.category,"done",1);bump(a.category,"sum",l.score||0)}}});
  const rows=Object.entries(cats).map(([cat,v])=>({cat,...v,avg:v.done?v.sum/v.done:0}));
  let html="";
  const best=rows.filter(x=>x.done>=2).sort((a,b)=>b.avg-a.avg)[0];
  if(best){const c=CAT[best.cat]||["何か","✨"],conf=best.done>=5?"高め":best.done>=3?"中":"まだ弱い";html+=`<div class="insightcard"><div class="eyebrow">実際にやった後</div><strong>${c[1]} 「${c[0]}」の満足度が今は高め <span class="conf">${conf}</span></strong><p>${best.done}回の実行から見ています。</p></div>`}
  const interest=rows.filter(x=>x.saved+x.intent>=3).sort((a,b)=>(b.saved+b.intent)-(a.saved+a.intent))[0];
  if(interest){const c=CAT[interest.cat]||["何か","✨"];html+=`<div class="insightcard"><div class="eyebrow">心が反応した方向</div><strong>♡ 「${c[0]}」を気にすることが多め</strong><p>保存や「今やる」を合わせて ${interest.saved+interest.intent}回です。</p></div>`}
  const gap=rows.filter(x=>x.intent>=3&&x.notDone>=2).sort((a,b)=>(b.notDone/b.intent)-(a.notDone/a.intent))[0];
  if(gap){const c=CAT[gap.cat]||["何か","✨"];html+=`<div class="insightcard"><div class="eyebrow">気になるけど実行しにくい</div><strong>→ 「${c[0]}」は選ぶけれど、やらない時もある</strong><p>興味がないとは限らず、時間・場所など条件の影響かもしれません。</p></div>`}
  if(!html)html='<div class="insightcard"><div class="eyebrow">まだ途中</div><strong>数回使うと、「気になる」と「やってよかった」の違いが見えてきます。</strong><p>記録のための記録は不要です。</p></div>';
  document.getElementById("insightList").innerHTML=html;

  const goods=done.filter(l=>l.score>=2).slice(0,8);
  document.getElementById("likedList").innerHTML=goods.length?goods.map(l=>{const a=logActivity(l);return a?`<div class="savedrow"><div class="ico">${a.emoji}</div><div class="rowmain"><div class="title">${a.title}</div><div class="sub"><span>またやりたい</span></div></div><div class="chev">♡</div></div>`:""}).join(""):'<div class="empty">まだありません。</div>';

  const completed=state.sessions.filter(s=>s.firstValueAt);
  if(completed.length){
    const times=completed.map(s=>s.firstValueAt-s.startedAt).sort((a,b)=>a-b),median=times[Math.floor(times.length/2)];
    const batches=completed.map(s=>s.batchesAtValue||1),avgB=batches.reduce((a,b)=>a+b,0)/batches.length;
    document.getElementById("metricNote").textContent=`端末内の実験メモ：最初の「保存 / 今やる」まで中央値 約${Math.round(median/1000)}秒、平均 ${avgB.toFixed(1)}バッチ。外部送信はしていません。`;
  }else document.getElementById("metricNote").textContent="改善用の操作データはこの端末内だけに保存しています。";
  document.getElementById("plusInterest").textContent=state.plusInterest?"✓ 気になる、と記録済み":"これなら有料でも少し気になる";
}
function renderAll(){renderActive();renderQuickCats();renderToday();renderLater();renderRediscover();renderInsights()}

function switchPage(p){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById("page-"+p).classList.add("active");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  window.scrollTo({top:0,behavior:"smooth"});renderAll();
}

function openSheet(type){
  const title=document.getElementById("sheetTitle"),desc=document.getElementById("sheetDesc"),opts=document.getElementById("sheetOptions");
  if(type==="time"){
    title.textContent="使える時間";desc.textContent="時間に近い候補を優先します。";
    const vals=[10,15,30,60,120];
    opts.innerHTML=vals.map(v=>`<button class="${v===minutes?"active":""}" data-time="${v}">${v===120?"2時間":v===60?"1時間":v+"分"}</button>`).join("");
    opts.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>{minutes=+b.dataset.time;document.getElementById("timeLabel").textContent=minutes===120?"2時間":minutes===60?"1時間":minutes+"分";track("time_select",{minutes});closeSheet();pickFour()});
  }else if(type==="category"){
    title.textContent="方向を選ぶ";desc.textContent="必要なときだけ。普段は「おまかせ」でOK。";
    opts.innerHTML=FILTERS.map(f=>`<button class="${f.id===filter?"active":""}" data-filter="${f.id}">${f.emoji} ${f.label}</button>`).join("");
    opts.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{selectCategory(b.dataset.filter);closeSheet()});
  }
  document.getElementById("sheetBack").classList.add("show");document.getElementById("sheet").classList.add("show");
}
function openReplaceSheet(newA){
  const title=document.getElementById("sheetTitle"),desc=document.getElementById("sheetDesc"),opts=document.getElementById("sheetOptions");
  title.textContent="今は1つだけ";
  desc.textContent=`「${state.active.title}」を選んでいます。新しく「${newA.title}」に変えますか？`;
  opts.innerHTML=`<button id="replaceNow">新しいWantに入れ替える</button><button id="saveOldReplace">今のWantを「あとで」に戻して入れ替える</button><button id="replaceCancel">キャンセル</button>`;
  document.getElementById("replaceNow").onclick=()=>replaceActive("replace");
  document.getElementById("saveOldReplace").onclick=()=>replaceActive("save_old");
  document.getElementById("replaceCancel").onclick=()=>{replacement=null;closeSheet()};
  document.getElementById("sheetBack").classList.add("show");document.getElementById("sheet").classList.add("show");
}
function closeSheet(){document.getElementById("sheetBack").classList.remove("show");document.getElementById("sheet").classList.remove("show")}

document.getElementById("timeBtn").onclick=()=>openSheet("time");
document.getElementById("catMore").onclick=()=>openSheet("category");
document.getElementById("sheetBack").onclick=()=>{replacement=null;closeSheet()};
document.getElementById("refreshBtn").onclick=nextBatch;
document.getElementById("quickAdd").onclick=quickAdd;
document.getElementById("quickInput").addEventListener("keydown",e=>{if(e.key==="Enter")quickAdd()});
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
document.getElementById("plusInterest").onclick=()=>{state.plusInterest=!state.plusInterest;track("plus_interest",{interested:state.plusInterest});save();toast(state.plusInterest?"Plusに興味あり、と端末内に記録しました":"記録を外しました")};

document.getElementById("timeLabel").textContent="30分";
renderQuickCats();pickFour();renderAll();markActiveReady();
</script>
